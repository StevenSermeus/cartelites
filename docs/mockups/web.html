/* Shared real, read-only TCGDex search. No shop data or credentials are sent. */
(function (root) {
  'use strict';
  const API = 'https://api.tcgdex.net/v2/';
  const cache = new Map();
  const promoIds = ['basep','np','dpp','hgssp','bwp','xyp','smp','swshp','svp','mep'];
  const prefixSets = {XY:'xyp',SM:'smp',SWSH:'swshp',SVP:'svp',BW:'bwp',DP:'dpp',HGSS:'hgssp',MEP:'mep'};
  const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim();
  const numberKey = s => norm(s).replace(/\s/g,'').replace(/\d+/g, d => String(Number(d)));
  async function get(path) {
    const previous = cache.get(path);
    if (previous && previous.until > Date.now()) return previous.value;
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), 18000);
    try {
      const response = await fetch(API + path, {signal:controller.signal, credentials:'omit'});
      if (response.status === 404) throw new Error('Catalogue ou langue indisponible dans TCGDex. Essayez une autre langue ou la saisie manuelle.');
      if (!response.ok) throw new Error('TCGDex indisponible (' + response.status + '). Réessayez.');
      const value = await response.json();
      cache.set(path, {until:Date.now()+15*60*1000,value});
      return value;
    } catch (error) {
      if (error.name === 'AbortError') throw new Error('TCGDex ne répond pas. Réessayez ou utilisez la saisie manuelle.');
      if (error instanceof TypeError) throw new Error('Connexion à TCGDex impossible. Vérifiez Internet ; si cet aperçu bloque le réseau, ouvrez le fichier HTML dans votre navigateur.');
      throw error;
    } finally {clearTimeout(timer);}
  }
  function parse(input) {
    const value=norm(input).replace(/\s*\/\s*/g,'/');
    if (/YX-P/.test(value)) return {kind:'typo',suggestion:value.replace(/YX-P/g,'XY-P')};
    const fraction=value.match(/(?:^|\s)([A-Z]*\d+[A-Z]*)\/(\d+)(?:$|\s)/);
    if(fraction) return {kind:'fraction',number:fraction[1],total:Number(fraction[2]),name:value.replace(fraction[0],' ').trim()};
    const promo=value.match(/(?:^|\s)(\d+[A-Z]*)\/([A-Z]+-P)(?:$|\s)/);
    if(promo) return {kind:'promo-series',number:promo[1],series:promo[2],name:value.replace(promo[0],' ').trim()};
    const black=value.match(/^(?:(.*?)\s+)?BLACK\s+STAR(?:\s+PROMOS?)?(?:\s+(\d+))?$/);
    if(black) return {kind:'black-star',number:black[2],name:black[1]||''};
    const prefixed=value.replace(/\s/g,'').match(/^(SWSH|HGSS|SVP|MEP|XY|SM|BW|DP)(\d+[A-Z]*)$/);
    if(prefixed) return {kind:'prefix',prefix:prefixed[1],number:prefixed[2],setId:prefixSets[prefixed[1]]};
    if(/^\d+$/.test(value)) return {kind:'number',number:value};
    return {kind:'name',name:input.trim()};
  }
  function cardResult(card,set,language,promoSeries) {
    const localId=String(card.localId);
    const isPromo=promoIds.includes(set.id) || /-P$/i.test(set.id);
    return {id:card.id,name:card.name,localId,setId:set.id,setName:set.name,language,
      printedNumber:promoSeries ? localId+'/'+promoSeries : isPromo ? localId : set.cardCount?.official ? localId+'/'+set.cardCount.official : localId,
      image:card.image ? card.image+['/','high','.webp'].join('') : undefined,provider:'tcgdex'};
  }
  async function search(input,language='fr',options={}) {
    if(!String(input).trim()) return {cards:[],note:'Saisissez un nom, un numéro complet ou une promo.',hasMore:false};
    if(!/^[a-z]{2}(?:-[a-z]{2})?$/.test(language)) throw new Error('Langue invalide.');
    const query=parse(input);
    if(query.kind==='typo') return {cards:[],note:'Vouliez-vous écrire '+query.suggestion+' ? Corrigez la recherche pour confirmer.',suggestion:query.suggestion,hasMore:false};
    let lang=language;
    let note='Résultats réels TCGDex · '+lang.toUpperCase();
    if(query.kind==='promo-series') {lang='ja';note='Série promo japonaise · recherche en japonais (JA).';}
    const sets=await get(lang+'/sets');
    if(!Array.isArray(sets)) throw new Error('Réponse de catalogue invalide.');
    let candidates;
    if(query.kind==='fraction') candidates=sets.filter(s=>s.cardCount?.official===query.total);
    else if(query.kind==='promo-series') candidates=sets.filter(s=>numberKey(s.id)===numberKey(query.series));
    else if(query.kind==='prefix') candidates=sets.filter(s=>s.id===query.setId);
    else if(query.kind==='black-star') candidates=sets.filter(s=>promoIds.includes(s.id));
    if(candidates) {
      if(!candidates.length) return {cards:[],note:query.kind==='promo-series'?'La série '+query.series+' n’est pas présente dans le catalogue japonais TCGDex consulté. Vous pouvez créer la fiche manuellement.':'Aucune série correspondante dans cette langue. Essayez une autre langue ou la saisie manuelle.',hasMore:false};
      const lists=await Promise.all(candidates.map(s=>get(lang+'/sets/'+encodeURIComponent(s.id))));
      const cards=lists.flatMap(set=>(set.cards||[]).filter(card=>{
        const key=numberKey(card.localId);
        const expected=query.kind==='prefix' && !['SVP','MEP'].includes(query.prefix) ? query.prefix+query.number : query.number;
        return (!expected || key===numberKey(expected)) && (!query.name || norm(card.name+' '+set.name).includes(query.name));
      }).map(card=>cardResult(card,set,lang,query.kind==='promo-series'?query.series:undefined)));
      return {cards,note:cards.length?note:'Aucune carte exacte dans les séries correspondantes. Essayez une autre langue ou la saisie manuelle.',hasMore:false};
    }
    const page=Math.max(1,Number(options.page)||1),pageSize=24;
    // Bare numbers are exact; name searches use the provider's substring search.
    const parameters=new URLSearchParams({'pagination:page':String(page),'pagination:itemsPerPage':String(pageSize)});
    parameters.set(query.kind==='number'?'localId':'name',query.kind==='number'?'eq:'+String(Number(query.number)):query.name);
    const rows=await get(lang+'/cards?'+parameters);
    if(!Array.isArray(rows)) throw new Error('Réponse de recherche invalide.');
    const cards=rows.map(card=>{
      const set=sets.find(s=>card.id.startsWith(s.id+'-'));
      return cardResult(card,set||{id:card.id.slice(0,card.id.lastIndexOf('-')),name:'Série non précisée'},lang);
    });
    return {cards,note:query.kind==='number'?'Numéro sans série : plusieurs cartes peuvent correspondre. Vérifiez la série et la langue.':note,hasMore:rows.length===pageSize,page};
  }
  root.CartelitesSearch={search,parse,clearCache:()=>cache.clear()};
})(typeof window!=='undefined'?window:globalThis);

function documentModal(d){return `<div class="notice">Aperçu illustratif de la maquette. Les PDF de production utiliseront les générateurs sauvegardés, sans changement de mise en page.</div><div class="previewpaper"><div class="brand" style="text-align:center">cartélites</div><div class="legal">Boutique de démonstration · Bruxelles</div><h3>${E(d.type)}</h3><p>${E(d.reference)} · Version ${d.version} · ${d.date}</p><p>Client : ${E(d.customer)}</p>${d.snapshot.map(l=>`<p>${E(l.name)} · ${l.qty} × ${eur((l.total||0)/(l.qty||1))}</p>`).join('')}<strong>Total : ${eur(d.total)}</strong><div class="sigline"><span>Boutique<br>${E(d.signed?d.shop:'À signer')}</span><span>Client<br>${E(d.signed?d.customer:'À signer')}</span></div></div>${!d.signed&&d.type!=='Ticket de vente'?`${field('Nom du client signataire','customer',d.customer)}${field('Signature client simulée (nom saisi)','clientSignature','')}${check('Le client a lu le document et consent à sa signature','consent',false)}${check('Je confirme l’utilisation de ma signature boutique','shopConsent',false)}${btn('Signer la version de démonstration','signDoc',d.id,'primary')}`:`<p class="muted">${d.signed?'Version signée figée.':'Ticket sans signature.'}</p>`}<div class="actions" style="margin-top:16px">${btn('Télécharger l’aperçu HTML','downloadDoc',d.id)}${btn('Nouvelle version','newDocVersion',d.id)}</div><h3>Envoyer une copie</h3>${field('Adresse e-mail','email',d.email||'client@exemple.test','email')}${btn('Envoyer la copie simulée','emailDoc',d.id)}<p class="muted">Aucun e-mail réel n’est envoyé.</p><h3>Tentatives d’envoi</h3>${d.emails.length?d.emails.map(e=>`<p>${e.date} · ${E(e.email)} · ${e.status==='accepted'?'Accepté par le fournisseur (simulation)':'Échec simulé — vous pouvez réessayer'}</p>`).join(''):'<p class="muted">Aucun envoi.</p>'}`}
function paymentFields(data,total){return select('Encaissement','payment',data.payment||'cash',[['cash','Espèces'],['transfer','Virement'],['mixed','Mixte'],['pending','À encaisser']])+`<div class="grid2">${field('Espèces reçues (€)','cash',data.cash??total/100,'number','min="0" step="0.01"')}${field('Virement reçu (€)','transfer',data.transfer??0,'number','min="0" step="0.01"')}${field('Date de réception','receivedAt',data.receivedAt||today(),'date')}${field('Référence du paiement','reference',data.reference||'')}</div><p class="muted">Pour espèces ou virement, le montant total est affecté automatiquement. Pour un paiement mixte, les deux montants doivent égaler exactement ${eur(total)}.</p>`}
function start(mode,purchase){w={mode,step:0,data:{contactId:db.contacts[0].id,date:today(),reference:'',notes:'',sellerNote:'',invoice:'',due:'2027-02-23',terms:'Commission déduite du prix vendu. Versement après encaissement. Restitution des invendus sur demande.',lines:[],...purchase}};if(purchase)w.editId=purchase.editId;ui.modal={type:'wizard',title:mode==='supplier'?'Achat fournisseur':mode==='consignment'?'Nouveau dépôt-vente':'Nouveau rachat'};render()}
function blankLine(){return{name:'Article à renseigner',number:'',set:'',language:'FR',qty:1,cost:0,market:0,percent:70,price:0,condition:'NM',company:'',grade:'',certificate:'',commission:30,tax:21,photos:[]}}
function wizard(){const mode=w.mode,d=w.data,labels=mode==='supplier'?['Fournisseur','Produits','Vérifier']:mode==='consignment'?['Déposant','Articles','Conditions','Vérifier']:['Client','Cartes','Estimation','Vérifier'];let content=`<div class="steps">${labels.map((x,i)=>`<span class="${w.step===i?'active':''}">${i+1}. ${x}</span>`).join('')}</div>`;if(w.step===0){content+=select(mode==='supplier'?'Fournisseur':mode==='consignment'?'Déposant':'Client','contactId',d.contactId,db.contacts.map(c=>[c.id,c.name]))+btn('Créer un contact ici','inlineContact','','quiet')+`<div id="inlineContact" ${d.newContact?'':'hidden'}>${field('Nom du nouveau contact','newContact',d.newContact||'')}${field('E-mail','newContactEmail',d.newContactEmail||'','email')}</div><div class="grid2">${field('Date','date',d.date,'date')}${field('Référence (facultative)','reference',d.reference)}</div>`+area('Note de la boutique','notes',d.notes)+(mode==='buyback'?area('Note du vendeur','sellerNote',d.sellerNote):'')+(mode==='supplier'?`<label class="field">Facture (nom enregistré dans la maquette)<input type="file" data-evidence="invoice"></label><p>${E(d.invoice||'Aucune facture sélectionnée')}</p>`:'')}
else if(w.step===1){content+=`<div class="tools"><input id="catalogueQuery" value="${E(d.query||'')}" placeholder="Nom, 60/106, XY95 ou 001/XY-P" aria-label="Rechercher dans TCGDex"><select id="catalogueLanguage" aria-label="Langue de recherche">${[['fr','Français'],['en','Anglais'],['ja','Japonais'],['zh','Chinois']].map(([v,l])=>`<option value="${v}" ${d.searchLanguage===v?'selected':''}>${l}</option>`).join('')}</select>${btn('Rechercher','catalogueSearch','','primary')}${btn('Saisie manuelle','manualLine')}</div><div id="catalogueResults" aria-live="polite">${d.searchStatus==='loading'?'<p>Recherche TCGDex en cours…</p>':d.searchError?`<div class="notice error">${E(d.searchError)} La saisie manuelle reste disponible.</div>`:d.searchCards?.length?d.searchCards.slice((d.resultPage||0)*6,((d.resultPage||0)+1)*6).map((c,i)=>row(c.name,`${E(c.printedNumber||c.localId)} · ${E(c.setName)} · ${E(c.language.toUpperCase())}`,btn('Choisir','selectCard',String((d.resultPage||0)*6+i),'tiny'))).join(''):d.searched?'<p>Aucun résultat exact. Précisez la série ou utilisez la saisie manuelle.</p>':'<p class="muted">Recherche réelle TCGDex. Les transactions restent fictives et locales.</p>'}${d.searchNote?`<p class="muted">${E(d.searchNote)}</p>`:''}</div>${d.searchCards?.length?`<div class="pager"><span>Résultats ${Math.min((d.resultPage||0)*6+1,d.searchCards.length)}–${Math.min(((d.resultPage||0)+1)*6,d.searchCards.length)} / ${d.searchCards.length}</span><div class="actions">${(d.resultPage||0)>0?btn('Précédents','catalogueLocalPage','-1','tiny'):''}${((d.resultPage||0)+1)*6<d.searchCards.length?btn('Suivants','catalogueLocalPage','1','tiny'):''}${d.searchPage>1?btn('Page TCGDex précédente','catalogueSearch',String(d.searchPage-1),'tiny'):''}${d.hasMore?btn('Page TCGDex suivante','catalogueSearch',String((d.searchPage||1)+1),'tiny'):''}</div></div>`:''}<h3>Articles sélectionnés (${d.lines.length})</h3>`;if(mode==='supplier')content+=select('Réapprovisionner un produit existant','existingItem','',[['','Choisir un produit'],...db.stock.filter(x=>x.origin==='Fournisseur').map(x=>[x.id,x.name])])+btn('Ajouter le produit existant','existingLine');content+=d.lines.map((l,i)=>`<div class="lineeditor"><div class="lineheader"><strong>Article ${i+1}</strong>${btn('Retirer','removeLine',String(i),'tiny')}</div><div class="grid2">${field('Nom',`lines.${i}.name`,l.name)}${field('Numéro complet',`lines.${i}.number`,l.number)}${field('Collection',`lines.${i}.set`,l.set)}${select('Langue',`lines.${i}.language`,l.language,['FR','EN','JA','ZH'])}${mode==='supplier'?field('Quantité',`lines.${i}.qty`,l.qty,'number','min="1" step="1"')+field('Coût unitaire HT (€)',`lines.${i}.cost`,l.cost,'number','min="0" step="0.01"')+field('TVA de vente (%)',`lines.${i}.tax`,l.tax,'number','min="0" max="100"'):''}${field('Prix de vente (€)',`lines.${i}.price`,l.price,'number','min="0" step="0.01"')}${mode==='consignment'?field('Commission (%)',`lines.${i}.commission`,l.commission,'number','min="0" max="100"'):''}</div><label class="field">Photos du produit (6 maximum, 1 Mo par photo)<input type="file" multiple accept="image/*" data-linephotos="${i}"></label><div class="photogrid">${(l.photos||[]).map((p,j)=>`<figure><img src="${E(p.src||'')}" alt="${E(p.name)}"><figcaption>${j===0?'Couverture':E(p.name)}</figcaption>${btn('Retirer','linePhotoRemove',i+':'+j,'tiny')}</figure>`).join('')}</div></div>`).join('')}
else if(mode==='buyback'&&w.step===2){content+=`<div class="tools"><input id="bulkPercent" type="number" min="0" max="100" value="70" aria-label="Pourcentage de reprise en lot">${btn('Appliquer à toutes les cartes','bulkPercent')}</div>${d.lines.map((l,i)=>`<div class="lineeditor"><strong>${E(l.name)} · ${E(l.number)}</strong><div class="grid2">${field('Valeur estimée (€)',`lines.${i}.market`,l.market,'number','min="0" step="0.01"')}${field('Reprise (%)',`lines.${i}.percent`,l.percent,'number','min="0" max="100"')}${select('État',`lines.${i}.condition`,l.condition,['M','NM','EX','GD','LP','PL','PO'])}${select('Société de gradation',`lines.${i}.company`,l.company,[['','Non gradée'],...db.companies.filter(x=>!x.archived).map(x=>x.name)])}${field('Grade libre',`lines.${i}.grade`,l.grade)}${field('Certificat',`lines.${i}.certificate`,l.certificate)}</div></div>`).join('')}<div class="tools"><input id="inlineCompany" placeholder="Nouvelle société de gradation" aria-label="Nouvelle société de gradation">${btn('Ajouter cette société','wizardCompany')}</div>${btn('Actualiser le total','wizardRefresh')}<div class="facts"><span>Total de reprise</span><strong>${eur(totalLines(d.lines,mode))}</strong><span>Gain théorique avant TVA et frais</span><strong>${eur(sum(d.lines,l=>cents(l.market))-totalLines(d.lines,mode))}</strong></div>`}
else if(mode==='consignment'&&w.step===2){content+=field('Échéance du dépôt','due',d.due,'date')+area('Conditions convenues','terms',d.terms)+`<p class="muted">La commission est déduite du prix vendu. Le contrat sera à signer avant la mise en vente.</p>`}
else{content+=`<div class="panel"><strong>${E(d.newContact||contact(d.contactId))}</strong><p>${E(d.date)} · ${d.lines.length} article(s)</p></div>${d.lines.map(l=>row(l.name,`${E(l.number)} · ${mode==='supplier'?l.qty+' unité(s)':mode==='consignment'?'Commission '+l.commission+'%':'Reprise '+l.percent+'%'}`,`<strong>${eur(mode==='supplier'?cents(l.cost)*Number(l.qty):mode==='consignment'?cents(l.price):Math.round(cents(l.market)*Number(l.percent)/100))}</strong>`)).join('')}<div class="facts"><span>${mode==='consignment'?'Valeur de vente convenue':'Total d’acquisition'}</span><strong>${eur(totalLines(d.lines,mode))}</strong></div>${mode==='consignment'?`<p>${E(d.terms)}</p>`:''}${check('J’ai vérifié les articles, montants et coordonnées','reviewed',d.reviewed)}<div class="notice">Cette confirmation modifie uniquement les données de démonstration de votre navigateur.</div>`}
content+=`<div class="stepfoot"><div class="actions">${w.step?btn('Retour','wizardBack'):btn('Fermer','close')}${btn('Garder le brouillon','saveDraft','','quiet')}</div><div class="actions">${w.step<labels.length-1?btn('Continuer','wizardNext','','primary'):(mode==='buyback'?btn('Enregistrer en attente','wizardCommit','pending'):'')+btn(mode==='consignment'?'Créer et préparer le contrat':'Valider en stock','wizardCommit','confirmed','primary')}</div></div>`;return content}
function modalBody(m){switch(m.type){case'wizard':return wizard();case'item':return itemModal(db.stock.find(x=>x.id===m.id));case'purchase':return purchaseModal(db.purchases.find(x=>x.id===m.id));case'sale':return saleModal(db.sales.find(x=>x.id===m.id));case'consignment':return consignmentModal(db.consignments.find(x=>x.id===m.id));case'document':return documentModal(db.documents.find(x=>x.id===m.id));case'gallery':{const x=db.stock.find(x=>x.id===m.id),p=x.photos[m.index];return `<img src="${p.src}" alt="${E(x.name)} — photo ${m.index+1}" style="width:100%;max-height:450px;object-fit:contain;border-radius:10px"><p>${E(x.description||'')}</p><div class="actions">${btn('Précédente','galleryNext','-1')}${btn('Suivante','galleryNext','1')}${btn('Retour à la fiche','item',x.id)}</div><p class="muted">Photo ${m.index+1} sur ${x.photos.length}</p>`}case'addStock':return `<p>Choisissez l’origine des articles à enregistrer.</p><div class="actions">${btn('Rachat particulier','start','buyback','primary')}${btn('Achat fournisseur','start','supplier')}${btn('Dépôt-vente','start','consignment')}</div>`;case'contact':{const c=db.contacts.find(x=>x.id===m.id)||{};return field('Nom','name',c.name)+field('E-mail','email',c.email,'email')+field('Téléphone','phone',c.phone)+area('Adresse','address',c.address)+select('Type','kind',c.kind||'Particulier',['Particulier','Entreprise'])+btn('Enregistrer le contact','contactSave',m.id||'','primary')}case'company':{const c=db.companies.find(x=>x.id===m.id)||{};return field('Nom de la société','name',c.name)+field('Site web (facultatif)','website',c.website||'','url')+btn('Enregistrer','companySave',m.id||'','primary')}case'profile':return field('Prénom','firstName',db.profile.firstName)+field('Nom','lastName',db.profile.lastName)+field('Qualité','capacity',db.profile.capacity)+field('Signature simulée','signature',db.profile.signature)+btn('Enregistrer mon signataire','profileSave','','primary');case'cartEdit':{const l=db.cart[m.index],x=db.stock.find(x=>x.id===l.itemId);return `<p>${E(l.name)} · ${x.qty} disponible(s)</p>`+field('Quantité','qty',l.qty,'number',`min="1" max="${x.qty}" step="1"`)+field('Prix unitaire (€)','price',l.price/100,'number','min="0" step="0.01"')+btn('Mettre à jour','cartSave',String(m.index),'primary')}case'checkout':return `<p>Total du panier : <strong>${eur(sum(db.cart,l=>l.qty*l.price))}</strong></p>`+field('Nom du client (facultatif)','customer','')+field('Date de vente','date',today(),'date')+paymentFields({},sum(db.cart,l=>l.qty*l.price))+check('J’ai vérifié les articles et le règlement','reviewed',false)+btn('Confirmer la vente','saleCommit','','primary');case'payment':{const s=db.sales.find(x=>x.id===m.id);return paymentFields({...s,cash:s.cash/100,transfer:s.transfer/100},s.total)+btn('Enregistrer la correction','paymentSave',s.id,'primary')}case'payout':{const d=db.consignments.find(x=>x.id===m.id);return `<p>${E(contact(d.contactId))} · Solde ${eur(due(d))}</p>`+field('Montant déjà versé (€)','amount',Math.max(0,due(d))/100,'number','min="0.01" step="0.01"')+field('Date','date',today(),'date')+select('Mode','method','Virement',['Virement','Espèces','Autre'])+field('Référence','reference','')+check('Je confirme que ce paiement a déjà été effectué','reviewed',false)+btn('Enregistrer le versement','payoutSave',d.id,'primary')}case'terms':{const d=db.consignments.find(x=>x.id===m.id);return area('Motif / autorisation du nouvel accord','authorization','')+area('Conditions','terms',d.terms)+d.lines.map((l,i)=>`<div class="lineeditor"><strong>${E(l.name)}</strong>${field('Nouveau prix convenu (€)',`lines.${i}.price`,l.price/100,'number','min="0" step="0.01"')}${field('Commission (%)',`lines.${i}.commission`,l.commission,'number','min="0" max="100"')}</div>`).join('')+btn('Créer la révision à signer','termsSave',d.id,'primary')}case'return':{const d=db.consignments.find(x=>x.id===m.id);return d.lines.map(l=>{const x=db.stock.find(x=>x.id===l.itemId);return x?.qty?check(`${x.name} · ${x.qty} unité(s) disponible(s)`,`items.${x.id}`,false):''}).join('')+area('État et notes de restitution','notes','')+btn('Confirmer la restitution et préparer le bon','returnSave',d.id,'primary')}case'gift':case'opening':{const x=db.stock.find(x=>x.id===m.id);return `<p>${E(x.name)} · ${x.qty} disponible(s)</p>`+field('Quantité','qty',1,'number',`min="1" max="${x.qty}" step="1"`)+(m.type==='gift'?field('Bénéficiaire','recipient','')+field('Motif','reason','')+area('Note','notes','')+`<label class="field">Justificatif<input type="file" id="giftEvidence"></label>`:field('Boosters par display','packSize',x.packSize||36,'number','min="1" step="1"')+field('Nom des boosters','targetName','Booster · '+x.set))+btn(m.type==='gift'?'Confirmer le don':'Confirmer l’ouverture','movementSave',m.type+':'+x.id,'primary')}case'moves':{const moves=db.moves.filter(x=>!m.id||x.itemId===m.id);return moves.length?moves.map(x=>row(x.name,`${x.date} · ${x.type==='gift'?'Don':x.type==='opening'?'Ouverture':x.type} · ${x.qty} unité(s)${x.reversed?' · Annulé':''}`,`${x.reversed?'':btn('Annuler le mouvement','movementReverse',x.id,'tiny')}`)).join(''):'<p>Aucun mouvement créé dans cette démonstration.</p>'}case'conflict':{const c=db.conflicts.find(x=>x.id===m.id);return `<p>${E(c.item)} · ${E(c.reason)}</p>`+area('Note de résolution','note',c.note)+btn('Marquer traité','conflictSave',c.id,'primary')}case'statement':return select('Dossier','consignmentId',m.id||db.consignments[0]?.id,db.consignments.map(d=>[d.id,d.reference+' · '+contact(d.contactId)]))+btn('Créer le relevé','statementSave','','primary');case'confirm':return `<p>${E(m.text)}</p>`+btn('Confirmer','confirmAction','','danger');default:return'<p>Élément introuvable.</p>'}}
function renderAuth(){return `<div class="auth"><div class="authlogo brand"><span class="mark">✦</span>cartélites</div><h1>${ui.auth==='register'?'Créer un compte':ui.auth==='reset'?'Mot de passe oublié':'Bonjour.'}</h1><p class="muted">${ui.auth==='reset'?'Recevez un lien de réinitialisation simulé.':'Retrouvez votre boutique et vos collections.'}</p><div id="authfields">${field('Adresse e-mail','email','steven@exemple.test','email')}${ui.auth==='reset'?'':field('Mot de passe de démonstration','password','','password','autocomplete="off"')}${ui.auth==='register'?field('Votre nom','name',''):''}</div>${btn(ui.auth==='reset'?'Envoyer le lien':ui.auth==='register'?'Créer le compte':'Se connecter','authSubmit','','primary')}<div class="actions">${ui.auth!=='login'?btn('Connexion','authMode','login','quiet'):btn('Mot de passe oublié','authMode','reset','quiet')}${ui.auth!=='register'?btn('Créer un compte','authMode','register','quiet'):''}</div><div class="notice">Maquette locale. Utilisez une adresse fictive et un mot de passe quelconque. Aucun identifiant n’est conservé ou transmis.</div></div>`}
function render(){const nav=[['dashboard','Vue d’ensemble'],['stock','Stock'],['sales','Ventes'],['purchases','Achats'],['consignments','Dépôts-ventes'],['contacts','Contacts'],['documents','Documents'],['exports','Exports'],['settings','Paramètres']];root.innerHTML=`<header class="top"><div class="brand"><span class="mark">✦</span>cartélites</div><div class="topright"><select data-control="scenario" aria-label="Scénario de démonstration">${[['normal','Démo · Normal'],['offline','Démo · Hors ligne'],['conflict','Démo · Conflit'],['email','Démo · Échec email']].map(([v,l])=>`<option value="${v}" ${ui.scenario===v?'selected':''}>${l}</option>`).join('')}</select>${db.authenticated?btn('Déconnexion','logout','','quiet'):''}</div></header>${ui.toast?`<div class="toast" role="status">${E(ui.toast)} ${btn('×','dismiss','','quiet')}</div>`:''}${!storageOK?'<div class="toast">Stockage local indisponible : les modifications restent en mémoire jusqu’à la fermeture.</div>':''}${db.authenticated?`<div class="layout"><nav class="side" aria-label="Navigation principale"><small>BOUTIQUE</small>${nav.map(([key,label])=>`<button class="${ui.page===key?'active':''}" data-action="nav" data-id="${key}">${label}${key==='sales'&&db.cart.length?' · '+db.cart.length:''}</button>`).join('')}<div class="sidefooter"><small>DÉMONSTRATION LOCALE</small>${btn('Réinitialiser','resetDemo','','tiny')}</div></nav><main class="main">${({dashboard,stock:stockView,purchases:purchasesView,sales:salesView,consignments:consignView,contacts:contactsView,documents:docsView,exports:exportsView,settings:settingsView}[ui.page]||stockView)()}</main></div>`:renderAuth()}${db.authenticated&&ui.modal?`<div class="overlay" id="overlay"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><header class="dialoghead"><h2 id="dialogTitle">${E(ui.modal.title)}</h2><button class="close" data-action="close" aria-label="Fermer">×</button></header><div id="modalbody">${modalBody(ui.modal)}</div></section></div>`:''}`;requestAnimationFrame(()=>{const dialog=root.querySelector('.dialog');root.style.minHeight=dialog?Math.max(730,dialog.scrollHeight+35)+'px':'730px'});save()}
function open(type,title,extra={}){returnFocus=document.activeElement;ui.modal={type,title,...extra};render();root.querySelector('.close')?.focus()}function close(){ui.modal=null;render()}function confirm(title,text,action,value){open('confirm',title,{text,action,value})}function fail(msg){notify(msg);let toast=root.querySelector('.toast');if(!toast){toast=document.createElement('div');toast.className='toast';toast.setAttribute('role','alert');root.querySelector('.top').after(toast)}toast.textContent=msg}function download(name,text,type='text/csv;charset=utf-8'){const a=document.createElement('a'),u=URL.createObjectURL(new Blob([text],{type}));a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function validateLines(){if(!w.data.lines.length)return'Ajoutez au moins un article.';for(const l of w.data.lines){if(!l.name.trim())return'Chaque article doit avoir un nom.';if(w.mode==='supplier'&&(!Number.isInteger(Number(l.qty))||Number(l.qty)<1||Number(l.cost)<0))return'Quantité entière positive et coût positif requis.';if(Number(l.price)<0)return'Le prix ne peut pas être négatif.';if(w.mode==='buyback'&&(Number(l.market)<0||Number(l.percent)<0||Number(l.percent)>100))return'Verifiez les valeurs estimées et pourcentages (0 à 100).';if(w.mode==='consignment'&&(Number(l.commission)<0||Number(l.commission)>100))return'Commission comprise entre 0 et 100 %.'}return''}

case'gift':open('gift','Donner / offrir',{id:v});break;case'opening':open('opening','Ouvrir un display',{id:v});break;case'movementSave':{const [type,itemId]=v.split(':'),x=db.stock.find(x=>x.id===itemId),d=collect(),qty=Number(d.qty);if(!Number.isInteger(qty)||qty<1||qty>x.qty)return fail('Quantité indisponible.');if(type==='gift'&&!d.reason.trim())return fail('Le motif du don est requis.');const pack=Number(d.packSize);if(type==='opening'&&(!Number.isInteger(pack)||pack<1||!d.targetName.trim()))return fail('Nom et nombre de boosters requis.');if(!guard())return;const move={id:id('m'),type,itemId,name:x.name,qty,cost:x.cost*qty,date:today(),recipient:d.recipient,reason:d.reason,notes:d.notes,reversed:false};if(type==='opening'){const total=qty*pack,child={...clone(x),id:id('i'),name:d.targetName,number:'Booster',qty:total,cost:Math.floor(move.cost/total),price:Math.round(x.price/pack),packSize:0,lot:id('LOT'),photos:[],visible:false};move.childId=child.id;move.childQty=total;move.exactCost=move.cost;move.costRemainder=move.cost-child.cost*total;db.stock.push(child)}x.qty-=qty;db.moves.push(move);audit(type==='gift'?'Don '+x.name:'Ouverture '+x.name);notify(type==='gift'?'Don enregistré sans vente.':'Display ouvert : boosters créés et coût total conservé dans le mouvement.');open('moves','Historique des mouvements',{id:itemId})}break;case'stockMoves':open('moves','Historique des mouvements',{id:v});break;case'movementReverse':confirm('Annuler ce mouvement','La trace restera conservée et les quantités seront rétablies si les articles sont disponibles.','movementReverseDo',v);break;case'movementReverseDo':{const m=db.moves.find(x=>x.id===v);if(m.reversed)return close();const x=db.stock.find(x=>x.id===m.itemId);if(m.type==='opening'){const child=db.stock.find(x=>x.id===m.childId);if(child.qty!==m.childQty)return fail('Impossible : certains boosters ont déjà quitté le stock.');if(!guard())return;child.qty=0}else if(!guard())return;x.qty+=m.qty;m.reversed=true;audit('Annulation mouvement '+m.name);notify('Mouvement annulé.');open('moves','Historique des mouvements',{id:m.itemId})}break;
case'contactNew':open('contact','Nouveau contact');break;case'contactEdit':open('contact','Modifier le contact',{id:v});break;case'contactSave':{const d=collect();if(!d.name.trim())return fail('Le nom est requis.');if(!guard())return;const c=db.contacts.find(x=>x.id===v);if(c)Object.assign(c,d);else db.contacts.push({id:id('c'),...d});audit('Enregistrement contact '+d.name);notify('Contact enregistré.');close()}break;case'companyNew':open('company','Ajouter une société');break;case'companyEdit':open('company','Modifier la société',{id:v});break;case'companySave':{const d=collect();if(!d.name.trim())return fail('Le nom est requis.');if(db.companies.some(c=>c.id!==v&&c.name.toLowerCase()===d.name.trim().toLowerCase()))return fail('Cette société existe déjà.');if(!guard())return;const c=db.companies.find(x=>x.id===v);if(c){const old=c.name;Object.assign(c,d);db.stock.filter(x=>x.company===old).forEach(x=>x.company=d.name)}else db.companies.push({id:id('g'),...d,archived:false});audit('Enregistrement société '+d.name);notify('Société de gradation enregistrée.');close()}break;case'companyToggle':if(!guard())return;{const c=db.companies.find(x=>x.id===v);c.archived=!c.archived;audit('Archivage société '+c.name);render()}break;case'profile':open('profile','Mon signataire boutique');break;case'profileSave':{const d=collect();if(!d.firstName.trim()||!d.lastName.trim()||!d.capacity.trim())return fail('Prénom, nom et qualité requis.');if(!guard())return;db.profile=d;audit('Mise à jour du signataire');notify('Profil enregistré pour les prochains documents.');close()}break;
case'makeDoc':{const [type,target]=v.split(':');makeDoc(type,target)}break;case'document':open('document',db.documents.find(x=>x.id===v).reference,{id:v});break;case'signDoc':{const data=collect(),d=db.documents.find(x=>x.id===v);if(!data.consent||!data.shopConsent||!data.clientSignature?.trim()||!data.customer?.trim())return fail('Identité, signature simulée et les deux consentements sont requis.');if(!guard())return;d.signed=true;d.customer=data.customer;d.clientSignature=data.clientSignature;d.consent=true;d.signedAt=new Date().toISOString();if(d.sourceType==='consignment'){const c=db.consignments.find(x=>x.id===d.targetId);c.status='signed';if(!c.activated){c.lines.forEach(l=>{const x=db.stock.find(x=>x.id===l.itemId);x.qty=l.qty});c.activated=true}}audit('Signature document '+d.reference);notify('Version signée dans la maquette. Aucun original de production modifié.');render()}break;case'newDocVersion':{const d=db.documents.find(x=>x.id===v);if(d.sourceType){makeDoc(d.sourceType,d.targetId);break}const n={...clone(d),id:id('doc'),reference:'DOC-'+String(db.documents.length+1).padStart(4,'0'),version:Math.max(...db.documents.filter(x=>x.targetId===d.targetId&&x.type===d.type).map(x=>x.version))+1,signed:false,date:today(),emails:[],consent:false};db.documents.push(n);audit('Nouvelle version '+n.reference);open('document',n.reference,{id:n.id})}break;case'emailDoc':{const data=collect(),d=db.documents.find(x=>x.id===v);if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email||''))return fail('Adresse e-mail valide requise.');if(d.sourceType==='sale'&&d.saleState){const sale=db.sales.find(s=>s.id===d.targetId);if(d.saleState!==JSON.stringify({status:sale.status,payment:sale.payment,cash:sale.cash,transfer:sale.transfer}))return fail('Le statut ou le règlement a changé. Créez une nouvelle version avant l’envoi.')}if(!guard())return;d.email=data.email;d.emails.push({date:new Date().toLocaleString('fr-BE'),email:data.email,status:ui.scenario==='email'?'failed':'accepted'});audit('Tentative email simulée '+d.reference);notify(ui.scenario==='email'?'Échec simulé. Le document reste disponible ; passez en Normal pour réessayer.':'Copie acceptée par le fournisseur simulé. Aucun e-mail réel envoyé.');render()}break;case'downloadDoc':{const d=db.documents.find(x=>x.id===v);download(d.reference+'-apercu.html','<!doctype html><meta charset="utf-8"><title>'+E(d.reference)+'</title><h1>Aperçu de démonstration</h1><p>Ce document ne remplace pas le PDF de production.</p><h2>'+E(d.type)+'</h2><p>'+E(d.customer)+'</p>'+d.snapshot.map(l=>'<p>'+E(l.name)+' — '+l.qty+' — '+eur(l.total)+'</p>').join('')+'<p>Total '+eur(d.total)+'</p>','text/html;charset=utf-8');notify('Aperçu HTML téléchargé.');render()}break;case'statement':open('statement','Créer un relevé déposant',{id:v});break;case'statementSave':{const d=collect();makeDoc('statement',d.consignmentId)}break;
case'export':{let rows;if(v==='Stock')rows=db.stock.map(x=>({nom:x.name,numero:x.number,origine:x.origin,quantite:x.qty,prix_eur:x.price/100,visible:x.visible}));else if(v==='Achats')rows=db.purchases.map(x=>({reference:x.reference,date:x.date,contact:contact(x.contactId),statut:x.status,total_eur:x.total/100}));else if(v==='Ventes')rows=db.sales.map(x=>({reference:x.reference,date:x.date,statut:x.status,paiement:x.payment,total_eur:x.total/100}));else if(v==='Contacts')rows=db.contacts;else if(v==='Dépôts')rows=db.consignments.map(x=>({reference:x.reference,deposant:contact(x.contactId),statut:x.status,solde_eur:due(x)/100}));else if(v==='Versements')rows=db.payouts;else rows=db.moves.filter(x=>x.type==='gift');if(!rows.length)return fail('Aucune donnée à exporter dans cette catégorie.');const keys=Object.keys(rows[0]),cell=v=>'"'+String(v??'').replace(/"/g,'""')+'"';download('cartelites-demo-'+v.toLowerCase()+'.csv','\uFEFF'+[keys.map(cell).join(';'),...rows.map(r=>keys.map(k=>cell(typeof r[k]==='object'?JSON.stringify(r[k]):r[k])).join(';'))].join('\r\n'));notify('CSV complet téléchargé.');render()}break;
case'logout':db.authenticated=false;ui.modal=null;ui.auth='login';ui.toast='Session de démonstration fermée.';render();break;case'authMode':ui.auth=v;ui.toast='';render();break;case'authSubmit':{const email=root.querySelector('[name=email]').value;if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email))return fail('Adresse e-mail valide requise.');if(!guard())return;if(ui.auth==='reset'){notify('Lien de réinitialisation simulé envoyé. Aucun e-mail réel.');ui.auth='login';render();return}const password=root.querySelector('[name=password]').value;if(!password)return fail('Entrez un mot de passe de démonstration.');if(ui.auth==='register'&&!root.querySelector('[name=name]').value.trim())return fail('Renseignez votre nom.');db.authenticated=true;notify('Connexion de démonstration ouverte. Aucun identifiant enregistré.');navigate('dashboard')}break;case'resetDemo':confirm('Réinitialiser la démonstration','Cela efface uniquement les transactions et fichiers fictifs de cette maquette dans votre navigateur.','resetDemoDo','');break;case'resetDemoDo':db=seed();w=null;ui.modal=null;ui.toast='Données de démonstration réinitialisées.';ui.p=1;render();break;case'confirmAction':{const m=ui.modal;await action(m.action,m.value)}break;default:notify('Action inconnue : '+a);render()}}catch(e){fail(e.message||'Impossible de terminer cette opération.')}}
