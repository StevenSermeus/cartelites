const products=Array.from({length:48},(_,i)=>{const b=base[i%base.length];return{id:i+1,name:b[0],number:b[1],set:b[2],tcg:b[3],price:b[4]+Math.floor(i/8)*100,condition:b[5],language:b[6],photos:[{url:b[7],label:'Face avant'}, {url:'',label:'Dos de la carte — emplacement photo'}, {url:'',label:'Détail de l’état — emplacement photo'}],quantity:b[5]==='Scellé'?6:1,description:'Une pièce sélectionnée pour votre collection. '+(b[5]==='Scellé'?'Produit conservé dans son emballage d’origine.':'La fiche présente la référence complète, la langue et l’état annoncé. Consultez les différentes vues pour examiner la carte.')+' Cette fiche et son prix sont des données de démonstration.',variant:i%3===0?'Reverse holo':'Normale',grading:b[5].includes('9')?b[5]:null};});
let state={q:'',tcg:'all',grade:'all',language:'all',min:'',max:'',sort:'selection',layout:'grid',page:1,size:9,filters:false};try{state={...state,...JSON.parse(localStorage.getItem('cartelites-public-demo')||'{}')}}catch{}let route='catalogue',detailId=null,photo=0,scenario='normal',guideStep=0;const initial={...state};function save(){try{localStorage.setItem('cartelites-public-demo',JSON.stringify(state))}catch{document.getElementById('persistnote').textContent='Préférences conservées pour cette session seulement.'}}
function filtered(){if(scenario==='empty')return[];const query=clean(state.q).replace(/\b0+(\d)/g,'$1');return products.filter(p=>(state.tcg==='all'||p.tcg===state.tcg)&&(state.grade==='all'||(state.grade==='graded'?!!p.grading:!p.grading))&&(state.language==='all'||p.language===state.language)&&(state.min===''||p.price>=Number(state.min)*100)&&(state.max===''||p.price<=Number(state.max)*100)&&clean(p.name+' '+p.number+' '+p.set+' '+p.condition).includes(query)).sort((a,b)=>state.sort==='priceAsc'?a.price-b.price:state.sort==='priceDesc'?b.price-a.price:state.sort==='recent'?b.id-a.id:state.sort==='selection'?a.id-b.id:a.name.localeCompare(b.name,'fr')||a.id-b.id)}
function art(p,index=0){const f=p.photos[index];return f?.url?`<img src="${esc(f.url)}" alt="${esc(p.name+' — '+f.label)}" loading="lazy" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><div class="fallback" hidden><small>Photo indisponible</small><span>${esc(p.number)}</span><small>${esc(f.label)}</small></div>`:`<div class="fallback"><small>${esc(p.tcg)}</small><span>${esc(p.number)}</span><small>${index===0?'Photo à ajouter':index===1?'Vue du dos':'Détail'}</small></div>`}
function card(p){return `<article class="product"><button data-product="${p.id}" aria-label="Voir ${esc(p.name+' '+p.number)}"><div class="art">${art(p)}</div><div><h3>${esc(p.name)}</h3><div class="meta">${esc(p.set)}<br>${esc(p.number)} · ${p.language.toUpperCase()}</div><div class="productbottom"><span class="price">${money(p.price)}</span><span class="badge">${esc(p.condition)}</span></div></div></button></article>`}
function option(value,label,selected){return `<option value="${value}" ${value===selected?'selected':''}>${label}</option>`}
function pager(total){const count=Math.max(1,Math.ceil(total/state.size));state.page=Math.min(state.page,count);const pages=Array.from({length:count},(_,i)=>i+1).filter(n=>n===1||n===count||Math.abs(n-state.page)<2);return `<nav class="pager" aria-label="Pagination du catalogue"><button class="btn" data-page="${state.page-1}" ${state.page===1?'disabled':''}>Précédent</button>${pages.map((n,i)=>(i&&n>pages[i-1]+1?'<span>…</span>':'')+`<button class="btn ${n===state.page?'active':''}" data-page="${n}" ${n===state.page?'aria-current="page"':''}>${n}</button>`).join('')}<button class="btn" data-page="${state.page+1}" ${state.page===count?'disabled':''}>Suivant</button><label>Par page <select id="size">${[6,9,18].map(n=>option(String(n),n,String(state.size))).join('')}</select></label></nav>`}
function listing(){const all=filtered(),pages=Math.max(1,Math.ceil(all.length/state.size));state.page=Math.min(state.page,pages);return `<div class="hero"><div class="eyebrow">Le catalogue Convention</div><h1>La prochaine pièce<br>de votre collection.</h1><p>Explorez le stock de la boutique. Ouvrez une fiche pour voir toutes les photos et les détails.</p></div><div class="searchline"><input id="search" class="input" value="${esc(state.q)}" aria-label="Rechercher dans le stock" placeholder="Nom, série, 60/106, XY95…"><button class="btn" data-action="filters" aria-expanded="${state.filters}">Filtres</button></div><div class="chips" aria-label="Jeu"><button class="chip ${state.tcg==='all'?'active':''}" data-tcg="all">Tout découvrir</button><button class="chip ${state.tcg==='pokemon'?'active':''}" data-tcg="pokemon">Pokémon</button><button class="chip ${state.tcg==='riftbound'?'active':''}" data-tcg="riftbound">Riftbound</button></div>${state.filters?`<div class="filterbox"><label>Gradation<select class="input" data-filter="grade">${option('all','Toutes les cartes',state.grade)+option('graded','Gradées',state.grade)+option('raw','Non gradées',state.grade)}</select></label><label>Langue<select class="input" data-filter="language">${option('all','Toutes les langues',state.language)+option('fr','Français',state.language)+option('en','Anglais',state.language)}</select></label><label>Prix minimum (€)<input class="input" data-filter="min" value="${esc(state.min)}" type="number" min="0"></label><label>Prix maximum (€)<input class="input" data-filter="max" value="${esc(state.max)}" type="number" min="0"></label><button class="btn" data-action="reset">Effacer les filtres</button></div>`:''}<div class="toolbar"><span class="muted" aria-live="polite">${all.length} articles · ${all.length?((state.page-1)*state.size+1)+'–'+Math.min(state.page*state.size,all.length):'0'} affichés</span><div><select id="sort" class="btn" aria-label="Trier">${option('selection','Notre sélection',state.sort)+option('name','Nom',state.sort)+option('priceAsc','Prix croissant',state.sort)+option('priceDesc','Prix décroissant',state.sort)+option('recent','Ajouts récents',state.sort)}</select> <button class="btn" data-action="layout" aria-label="Changer la présentation">${state.layout==='grid'?'Liste':'Grille'}</button></div></div>${Number(state.min)>Number(state.max)&&state.max!==''?'<p class="error" role="alert">Le prix minimum dépasse le prix maximum.</p>':''}<div class="grid ${state.layout}">${all.slice((state.page-1)*state.size,state.page*state.size).map(card).join('')}</div>${!all.length?`<div class="empty"><h2>${scenario==='empty'?'La collection se prépare.':'Aucun article ne correspond.'}</h2><p>${scenario==='empty'?'Revenez découvrir les prochaines pièces.':'Essayez un nom plus court ou retirez un filtre.'}</p><button class="btn" data-action="reset">Réinitialiser</button></div>`:''}${pager(all.length)}`}
function detail(){const p=products.find(x=>x.id===detailId),unavailable=scenario==='sold';return `<button class="btn back" data-go="catalogue">← Retour aux résultats</button><div class="detail"><div><button class="art" style="width:100%;border:0" data-action="zoom" aria-label="Agrandir ${esc(p.photos[photo].label)}">${art(p,photo)}</button><div class="thumbs" role="group" aria-label="Photos du produit">${p.photos.map((f,i)=>`<button class="${i===photo?'active':''}" data-photo="${i}" aria-label="${esc(f.label)}" aria-pressed="${i===photo}">${f.url?`<img src="${esc(f.url)}" alt="${esc(f.label)}">`:i===1?'Dos':'Détail'}</button>`).join('')}</div><p class="muted">${esc(p.photos[photo].label)} · ${photo+1}/${p.photos.length}. Les vues sans photo sont des emplacements de démonstration.</p></div><div><span class="eyebrow">${esc(p.tcg)} · ${esc(p.set)}</span><h1>${esc(p.name)}</h1><p>${esc(p.number)} · ${p.language.toUpperCase()}</p><div class="price">${money(p.price)}</div><span class="badge">${unavailable?'Indisponible':p.quantity+' disponible'+(p.quantity>1?'s':'')+' en boutique'}</span><dl class="facts"><dt>État</dt><dd>${esc(p.condition)}</dd><dt>Variante</dt><dd>${esc(p.variant)}</dd><dt>Langue</dt><dd>${p.language==='fr'?'Français':'Anglais'}</dd><dt>Gradation</dt><dd>${esc(p.grading||'Non gradée')}</dd><dt>Référence boutique</dt><dd>CT-${String(p.id).padStart(4,'0')}</dd></dl><p>${esc(p.description)}</p><div class="actions"><button class="btn primary" data-go="contact">Contacter la boutique</button><button class="btn" data-action="copy">Copier la référence</button></div><p class="muted" id="copy-status" aria-live="polite">Consultation du stock uniquement. La fiche ne réserve pas l’article.</p></div></div><h2>À découvrir aussi</h2><div class="grid">${products.filter(x=>x.id!==p.id&&x.tcg===p.tcg).slice(0,3).map(card).join('')}</div>`}
function guide(kind){const buy=kind==='buyback',steps=buy?['Préparer','Estimer','Confirmer','Signer']:['Préparer','Convenir','Signer','Suivre'];const texts=buy?[['Préparez vos cartes','Rassemblez vos cartes, leurs références, leurs langues et vos photos. Notez les gradations et certificats éventuels.'],['Une estimation avec la boutique','L’équipe identifie les cartes et leur état, puis vous présente une estimation et un montant de reprise. Vous pouvez accepter ou refuser la proposition.'],['Vérifiez le récapitulatif','Vérifiez la liste, les prix, vos coordonnées et les notes convenues. Toute modification doit apparaître avant votre accord.'],['Votre exemplaire signé','Vous lisez le bordereau puis signez avec le représentant de la boutique. Votre exemplaire est remis par téléchargement ou email.']]:[['Préparez votre dépôt','Identifiez les articles et leur état. Le dépôt-vente vous permet de confier des articles à la boutique selon un accord.'],['Des conditions explicites','La boutique et vous convenez du prix, de la commission, de la durée et des conditions de restitution. Aucun taux affiché ici ne constitue une offre.'],['Vérifiez et signez','Relisez le contrat et l’inventaire, puis signez. Une nouvelle version est nécessaire si les conditions changent.'],['Ventes et reversements','La boutique suit les ventes et les reversements dus. Un article invendu peut être restitué selon les conditions convenues.']];return `<div class="text"><div class="eyebrow">${buy?'Rachat':'Dépôt-vente'}</div><h1>${buy?'Une nouvelle vie<br>pour vos cartes.':'Vos cartes.<br>Notre vitrine.'}</h1><p>Découvrez les étapes du parcours en boutique.</p><div class="steps">${steps.map((x,i)=>`<button class="step btn ${i===guideStep?'active':''}" data-step="${i}">${i+1}. ${x}</button>`).join('')}</div><div class="panel"><h2>${texts[guideStep][0]}</h2><p>${texts[guideStep][1]}</p></div><div class="actions"><button class="btn" data-step="${guideStep-1}" ${guideStep===0?'disabled':''}>Précédent</button>${guideStep<3?`<button class="btn primary" data-step="${guideStep+1}">Étape suivante</button>`:'<button class="btn primary" data-go="contact">Contacter la boutique</button>'}</div><h2>Questions fréquentes</h2><details><summary>Puis-je apporter une carte promo ?</summary><p>Oui. Indiquez son numéro complet, sa série et sa langue. Une photo aide à identifier les références absentes du catalogue.</p></details><details><summary>Mes cartes sont-elles réservées en ligne ?</summary><p>Le site présente le stock et les services. Aucun achat, réservation ou contrat n’est conclu dans cette maquette.</p></details><details><summary>Comment conserver mon document ?</summary><p>Le parcours prévoit un exemplaire PDF. Les originaux signés restent conservés et une correction produit une nouvelle version.</p></details></div>`}
function information(){if(route==='contact')return `<div class="text"><div class="eyebrow">La boutique</div><h1>Parlons de<br>votre collection.</h1><p>Une question sur une carte, un rachat ou un dépôt ? Préparez la référence du produit pour faciliter l’échange.</p><div class="panel"><h3>Cartélites</h3><p>Rue lieutenant tasse 68B1<br>6141 Forchies-la-Marche, Belgique</p><p><a href="mailto:steven@wdee.dev">steven@wdee.dev</a><br><a href="tel:+32492925095">+32 492 92 50 95</a></p><p class="muted">Coordonnées reprises de la configuration actuelle. Confirmez les horaires directement auprès de la boutique.</p></div><button class="btn" data-go="catalogue">Explorer les cartes</button></div>`;const pages={legal:['Mentions légales','Exploitant','WDEE SRL · BCE 1034.196.875 · TVA BE1034.196.875. Adresse et contact accessibles depuis La boutique.','Les informations légales complètes et l’hébergement seront validés avant publication. Cette page décrit une maquette, pas un texte juridique final.'],privacy:['Confidentialité','Vos données','Le catalogue de démonstration ne collecte aucun compte client. Vos filtres peuvent être conservés dans le stockage local de votre navigateur.','La politique de la future application précisera les traitements des clients, signatures, documents et emails ainsi que les durées de conservation.'],cookies:['Cookies et préférences','Une navigation simple','Cette maquette ne comporte ni publicité ni outil de suivi. Elle conserve uniquement vos filtres de démonstration dans le stockage local, quand le navigateur l’autorise.','Vous pouvez effacer ces préférences à tout moment. Les cookies de session de la future application seront décrits séparément.']};const x=pages[route]||pages.legal;return `<div class="text"><h1>${x[0]}</h1><h2>${x[1]}</h2><p>${x[2]}</p><p>${x[3]}</p>${route==='cookies'?'<button class="btn" data-action="reset">Effacer mes préférences</button>':''}<p class="muted">Prototype de navigation · textes à valider avant mise en ligne.</p><button class="btn" data-go="catalogue">Retour au catalogue</button></div>`}
function render(){document.querySelectorAll('[data-go]').forEach(b=>b.classList.toggle('active',b.dataset.go===route));content.innerHTML=(scenario==='offline'||scenario==='error')&&['catalogue','detail'].includes(route)?`<div class="empty"><h1>${scenario==='offline'?'Connexion interrompue':'Le catalogue ne répond pas.'}</h1><p>Les disponibilités ne peuvent pas être confirmées. Vos filtres sont conservés.</p><button class="btn primary" data-action="retry">Réessayer</button></div>`:route==='catalogue'?listing():route==='detail'?detail():['buyback','consignment'].includes(route)?guide(route):information();save()}
root.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go){route=b.dataset.go;guideStep=0;render();return}if(b.dataset.product){detailId=Number(b.dataset.product);photo=0;route='detail';render();return}if(b.dataset.page){state.page=Number(b.dataset.page);render();return}if(b.dataset.tcg){state.tcg=b.dataset.tcg;state.page=1;render();return}if(b.dataset.photo){photo=Number(b.dataset.photo);render();return}if(b.dataset.step){guideStep=Math.max(0,Math.min(3,Number(b.dataset.step)));render();return}const a=b.dataset.action;if(a==='filters'){state.filters=!state.filters;render()}if(a==='layout'){state.layout=state.layout==='grid'?'list':'grid';render()}if(a==='reset'){state={q:'',tcg:'all',grade:'all',language:'all',min:'',max:'',sort:'selection',layout:'grid',page:1,size:9,filters:false};scenario='normal';document.getElementById('scenario').value=scenario;render()}if(a==='retry'){scenario='normal';document.getElementById('scenario').value='normal';render()}if(a==='copy'){const p=products.find(x=>x.id===detailId),text=`${p.name} — ${p.number} — CT-${String(p.id).padStart(4,'0')}`;try{await navigator.clipboard.writeText(text);document.getElementById('copy-status').textContent='Référence copiée.'}catch{document.getElementById('copy-status').textContent='Référence à copier : '+text}}if(a==='zoom'){const p=products.find(x=>x.id===detailId),div=document.createElement('div');div.className='zoom';div.setAttribute('role','dialog');div.setAttribute('aria-modal','true');div.setAttribute('aria-label','Photo agrandie');div.innerHTML=`<button class="btn" id="closezoom">Fermer la photo</button><div class="art">${art(p,photo)}</div><p>${esc(p.photos[photo].label)}</p>`;root.append(div);content.inert=true;const close=()=>{div.remove();content.inert=false;b.focus()};div.querySelector('button').onclick=close;div.onkeydown=e=>{if(e.key==='Escape')close();if(e.key==='Tab'){e.preventDefault();div.querySelector('button').focus()}};div.querySelector('button').focus()}});
root.addEventListener('input',e=>{if(e.target.id==='search'){const start=e.target.selectionStart;state.q=e.target.value;state.page=1;render();const input=document.getElementById('search');input.focus();input.setSelectionRange(start,start)}});root.addEventListener('change',e=>{const el=e.target;if(el.dataset.filter){state[el.dataset.filter]=el.value;state.page=1;render()}if(el.id==='sort'){state.sort=el.value;state.page=1;render()}if(el.id==='size'){state.size=Number(el.value);state.page=1;render()}if(el.id==='scenario'){scenario=el.value;render()}});window.CatalogueDemo={getState:()=>({...state,route,detailId}),products};render();})();
</script></body></html>
