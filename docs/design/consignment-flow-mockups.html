ique','Boutique'],['signature','Client signe'],['final','Archive & e-mail']];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const btn=(s,t,cl='row')=>`<button class="${cl}" data-go="${s}">${t}</button>`;const row=(title,sub,right='',go='')=>`<${go?'button':'div'} class="row" ${go?`data-go="${go}"`:''}><span class="main"><b>${title}</b>${sub?`<small>${sub}</small>`:''}</span>${right}${go?'<span class="chev">›</span>':''}</${go?'button':'div'}>`;const card=(name,sub,price,go='card',blue=false)=>`<button class="row" data-go="${go}"><span class="cardart ${blue?'blue':''}">${name[0]}</span><span class="main"><b>${name}</b><small>${sub}</small></span><span class="amount">${price}</span><span class="chev">›</span></button>`;const section=(label,html)=>`<div class="label">${label}</div><div class="group">${html}</div>`;const primary=(label,go)=>btn(go,label,'primary');let footer='',navTitle='',back='',title='',body='',tab='rachat';function documentView(){return `<article class="document" aria-label="Bordereau de rachat de démonstration"><div class="dochead"><div class="brand">cartélites<span style="color:#c5943e">.</span><div style="font-size:8px;font-weight:400;letter-spacing:1px;color:#444">CARTES & COLLECTIONS</div></div><div style="text-align:right">DOCUMENT DE DÉMONSTRATION<br>20 novembre 2026<br>Réf. R-2026-0042</div></div><div class="doctitle">Bordereau de rachat</div><div>Exemplaire vendeur · ${signed?'Signé · version 1':'À signer · version 1'}</div><div class="docmeta"><div><b>ACHETEUR</b><br>Cartélites · WDEE SRL<br>Belgique<br>Coordonnées légales à compléter</div><div><b>VENDEUR</b><br>${esc(client)}<br>${esc(email)}<br>Coordonnées de démonstration</div></div><table><thead><tr><th>Désignation & état</th><th>Cote</th><th>Reprise</th><th>Montant</th></tr></thead><tbody><tr><td><b>Mew-ex · 152</b><br>Français · Near Mint</td><td>94,00 €</td><td>80 %</td><td>75,20 €</td></tr><tr><td><b>Mew ex · 158</b><br>Anglais · Near Mint</td><td>42,70 €</td><td>75 %</td><td>32,03 €</td></tr>${added?`<tr><td><b>Mew-ex · exemplaire 2</b><br>Français · Near Mint</td><td>${euro(quote)}</td><td>${rate} %</td><td>${euro(quote*rate/100)}</td></tr>`:''}</tbody></table><div class="doctotal">Total du rachat &nbsp; ${euro(total())}</div><div class="vat">Le vendeur déclare que les biens faisant l’objet du présent bordereau n’ont donné lieu, dans son chef, à aucune déduction ni restitution de TVA.</div><div class="docsign"><div><b>Le vendeur</b><br>${esc(client)}${signed&&sigData?`<img src="${sigData}" alt="Signature du vendeur" style="width:100%;height:44px;object-fit:contain">`:`<p>${signed?'Signature de démonstration':' '}</p>`}</div><div><b>Pour Cartélites</b><br>Représentant de la boutique<p>${signed?'Signature boutique':' '}</p></div></div><div class="docfoot">Cartélites · Bordereau R-2026-0042 · ${signed?'Document signé archivé':'Aperçu avant signature'} · Page 1 / 1</div></article>`}

'}</p></div></div>`;
if(kind==='statement')content=`<p>Situation datée · tous les dépôts d’Emma Laurent</p><table><thead><tr><th>Vente encaissée</th><th>Prix vendu</th><th>Commission</th><th>Part déposant</th></tr></thead><tbody>${depSold?`<tr><td>Pikachu · DV-2026-0018</td><td>${euro(depSale)}</td><td>${euro(depSale*depSaleRate/100)}</td><td>${euro(depEarned())}</td></tr>`:'<tr><td colspan="4">Aucune vente encaissée</td></tr>'}</tbody></table><div class="doctotal">Part acquise : ${euro(depEarned())}<br>Versements enregistrés : ${euro(depPaid)}<br>Reste à reverser : ${euro(depBalance())}</div><p>Le décompte n’atteste pas à lui seul la remise d’argent. Les ventes non encaissées sont exclues du solde payable. Aucun calcul de TVA n’est inventé par ce document.</p>`;
if(kind==='payment')content=`<p>Reversement enregistré · référence PAY-DEMO-001</p><div class="doctotal">Montant : ${euro(depLastPaid)}</div><table><tbody><tr><td>Déposant</td><td>Emma Laurent</td></tr><tr><td>Mode / date</td><td>Virement · 20/11/2026</td></tr><tr><td>Référence fournie</td><td>DV-2026-0018</td></tr><tr><td>Solde restant tous dépôts</td><td>${euro(depBalance())}</td></tr></tbody></table><p>Enregistrement du versement déclaré effectué. Ce document n’exécute pas un transfert et ne remplace pas un justificatif bancaire.</p>`;
if(kind==='return')content=`<p>Restitution du 20/11/2026 · référence RET-DEMO-001</p><table><thead><tr><th>Article remis</th><th>État à la remise</th><th>Quantité</th></tr></thead><tbody><tr><td>ETB Évolutions Prismatiques</td><td>Scellé intact</td><td>1</td></tr></tbody></table><div class="vat">Le déposant accuse réception de l’article décrit ci-dessus. Cette restitution ne constate aucune vente ni aucun versement.</div><div class="docsign"><div><b>Pour Cartélites</b><p>${depReturned?'Remise confirmée':'À confirmer'}</p></div><div><b>Le déposant</b><p>${depReturned?'Réception signée':'À signer'}</p></div></div>`;

function filterBuybacks(){const field=root.querySelector('#buybacksearch');if(!field)return;buybackSearch=field.value;const normalize=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();const query=normalize(buybackSearch);let count=0;root.querySelectorAll('[data-buyback-section]').forEach(section=>{let visible=0;section.querySelectorAll('.row').forEach(row=>{const match=normalize(row.textContent).includes(query)&&(buybackStatus==='all'||section.dataset.status===buybackStatus)&&(!buybackFrom||section.dataset.date>=buybackFrom)&&(!buybackTo||section.dataset.date<=buybackTo);row.hidden=!match;if(match){visible++;count++}});section.hidden=!visible});root.querySelector('#buybackempty').hidden=count!==0;root.querySelector('#clearbuybacks').hidden=!buybackSearch;const active=Number(buybackStatus!=='all')+Number(Boolean(buybackFrom))+Number(Boolean(buybackTo));const badge=root.querySelector('#buybackbadge');badge.hidden=!active;badge.textContent=active;root.querySelector('#openbuybackfilters').setAttribute('aria-label',`Recherche et filtres, ${active} filtre${active===1?'':'s'} actif${active===1?'':'s'}`);root.querySelector('#applybuybackfilters').textContent=`Afficher ${count} résultat${count===1?'':'s'}`;root.querySelector('#buybackcount').textContent=query||active?`${count} rachat${count===1?'':'s'} trouvé${count===1?'':'s'}`:'';}function clearBuybacks(){const field=root.querySelector('#buybacksearch');field.value='';filterBuybacks();field.focus()}function go(s){screen=s;render()}function wire(){const q=s=>root.querySelector(s);if(q('#buybacksearch')){q('#buybacksearch').value=buybackSearch;q('#buybackstatus').value=buybackStatus;q('#buybackfrom').value=buybackFrom;q('#buybackto').value=buybackTo;const sheet=q('#buybacksheet');sheet.hidden=!buybackFiltersOpen;const close=()=>{buybackFiltersOpen=false;sheet.hidden=true;q('#openbuybackfilters').focus()};q('#openbuybackfilters').onclick=()=>{buybackFiltersOpen=true;sheet.hidden=false;q('#buybacksearch').focus()};q('#closebuybackfilters').onclick=close;q('#applybuybackfilters').onclick=close;sheet.onclick=e=>{if(e.target===sheet)close()};sheet.onkeydown=e=>{if(e.key==='Escape')close()};q('#buybackstatus').onchange=e=>{buybackStatus=e.target.value;filterBuybacks()};q('#buybackfrom').onchange=e=>{buybackFrom=e.target.value;filterBuybacks()};q('#buybackto').onchange=e=>{buybackTo=e.target.value;filterBuybacks()};q('#resetbuybackfilters').onclick=()=>{buybackStatus='all';buybackFrom='';buybackTo='';q('#buybackstatus').value='all';q('#buybackfrom').value='';q('#buybackto').value='';filterBuybacks()};q('#buybacksearch').oninput=filterBuybacks;q('#clearbuybacks').onclick=clearBuybacks;filterBuybacks()}if(q('#rate'))q('#rate').oninput=e=>{rate=+e.target.value;q('#ratevalue').textContent=rate+' %';q('#cardprice').textContent=euro(quote*rate/100)};if(q('#quote'))q('#quote').oninput=e=>{quote=+e.target.value;q('#cardprice').textContent=euro(quote*rate/100)};if(q('#photo'))q('#photo').onchange=e=>q('#photonote').textContent=e.target.files[0]?'Photo sélectionnée · maquette':'';if(q('#approve'))q('#approve').onchange=e=>{confirmed=e.target.checked;q('#approvebtn').disabled=!confirmed};if(q('#commission'))q('#commission').oninput=e=>{const c=Math.min(30,Math.max(15,+e.target.value));q('#selleramount').textContent=euro(210*(1-c/100));q('#fee').textContent=euro(210*c/100)};if(q('#cash'))q('#cash').oninput=e=>q('#change').textContent=euro(Math.max(0,+e.target.value-136.7));if(q('#paytype'))q('#paytype').onchange=e=>q('#paymentnote').textContent=e.target.value==='En attente'?'La vente restera à encaisser. Aucun paiement reçu n’est enregistré.':e.target.value==='Mixte'?'Exemple : répartir le montant entre espèces et virement.':'Confirmez uniquement après avoir reçu le paiement.';if(q('#discount'))q('#discount').oninput=e=>{saleAmount=Math.max(0,136.7-+e.target.value);q('#saletotal').textContent=euro(saleAmount)};if(q('#clientsearch'))q('#clientsearch').oninput=e=>q('#clients').style.display=client.toLowerCase().includes(e.target.value.toLowerCase())?'':'none';if(q('#stocksearch'))q('#stocksearch').oninput=e=>q('#stockrows').querySelectorAll('.row').forEach(r=>r.hidden=!r.textContent.toLowerCase().includes(e.target.value.toLowerCase()));if(q('#screenpicker'))q('#screenpicker').onchange=e=>go(e.target.value);if(q('#canvas')){const c=q('#canvas'),ctx=c.getContext('2d');let drawing=false,drawn=false;const point=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};ctx.strokeStyle=getComputedStyle(root).getPropertyValue('--c-text').trim().startsWith('light-dark')?'#34343a':getComputedStyle(root).color;ctx.lineWidth=4;ctx.lineCap='round';c.onpointerdown=e=>{drawing=true;drawn=true;c.setPointerCapture(e.pointerId);ctx.beginPath();ctx.moveTo(...point(e));q('#signbtn').disabled=!q('#accept').checked};c.onpointermove=e=>{if(drawing){ctx.lineTo(...point(e));ctx.stroke()}};c.onpointerup=()=>drawing=false;q('#accept').onchange=e=>q('#signbtn').disabled=!(drawn&&e.target.checked);c.clear=()=>{ctx.clearRect(0,0,c.width,c.height);drawn=false;q('#signbtn').disabled=true}}}
