border:0;border-top:1px solid var(--c-line);margin:18px 0}.inline-message{font-size:12px;margin-top:10px;color:var(--c-green)}.number{font-variant-numeric:tabular-nums}.readable{max-width:560px;margin:auto}.readable h2{margin:24px 0 10px!important}.readable p{font-size:13px;color:var(--c-muted);margin:10px 0!important}.filebox{border:1px dashed #cbbda6;border-radius:8px;padding:18px;font-size:12px;text-align:center;color:var(--c-muted);margin-top:14px}.filebox input{max-width:100%;font-size:11px!important}.routehint{font-size:10px;color:var(--c-muted);margin-top:12px;overflow-wrap:anywhere}.statecaption{font-size:11px;color:var(--c-muted);margin-top:9px;display:flex;justify-content:space-between;gap:10px}.statecaption strong{font-weight:500}.mobile .modalstage{padding:20px 10px}.mobile .dialog{padding:20px}.mobile .dialog .fields{grid-template-columns:1fr}.mobile .metrics{gap:8px}.mobile .metric{padding:13px}.mobile .metric strong{font-size:23px}

<body>
<div id="atelier">
 <div class="inspect" aria-label="Explorer les maquettes">
  <label>Page<select id="page-picker" aria-label="Page de la maquette"></select></label>
  <label>État<select id="state-picker" aria-label="État de la page"></select></label>
  <label class="device">Format<select id="device-picker" aria-label="Format"><option value="desktop">Bureau</option><option value="mobile">Mobile</option></select></label>
 </div>
 <div id="product" class="app"></div>
 <div class="statecaption"><strong id="coverage"></strong><span>Prototype · données fictives · aucune opération réelle</span></div>
</div>
<script>
(()=>{'use strict';
const root=document.getElementById('atelier'), product=document.getElementById('product');
const pages=[
 ['base','Fondations','Design system',['ready']],
 ['dashboard','Vue d’ensemble','/admin/dashboard',['ready','loading','empty','error']],
 ['stock','Stock','/admin/stock',['ready','selected','hidden','empty','noresults','loading','error','stale']],
 ['item','Article','/admin/stock/:itemId',['ready','hidden','sold','missing','error']],
 ['sell','Nouvelle vente','/admin/sales',['ready','added','empty','noresults','loading','error']],
 ['cart','Panier et confirmation','/admin/sales/cart',['ready','payment-error','below-agreement','stale','submitting','success','empty']],
 ['sales','Historique des ventes','/admin/sales/history',['ready','pending','legacy','cancelled','payment-dialog','empty','noresults','loading','error']],
 ['sale','Vente','/admin/sales/history/:saleId',['ready','pending','payment-dialog','cancel-dialog','cancelled','error']],
 ['conflicts','Conflits de vente','/admin/sales/conflicts',['ready','empty','stale','error','success']],
 ['purchases','Rachats','/admin/purchase-history',['ready','pending','empty','noresults','loading','error']],
 ['purchase-new','Nouveau rachat','/admin/purchases',['ready','client-search','client-loading','client-noresults','client-search-error','client-selected','validation','lookup-loading','lookup-error','client-dialog','submitting','success','upload-error']],
 ['purchase','Rachat','/admin/purchase-history/:purchaseId',['ready','pending','cancel-dialog','success','document-error','missing']],
 ['deposits','Dossiers de dépôt','/admin/consignments',['ready','overdue','empty','noresults','loading','error']],
 ['deposit-new','Nouveau dépôt','/admin/consignments/new',['ready','client-search','client-loading','client-noresults','client-search-error','client-selected','validation','client-dialog','submitting','success','upload-error']],
 ['deposit','Dossier de dépôt','/admin/consignments/:consignmentId',['ready','agreement-dialog','agreement-error','return-dialog','returned','sold','stale','upload-error']],
 ['payouts','Reversements','/admin/consignments/payouts',['ready','payout-dialog','payout-error','regularization','empty','loading','error','success']],
 ['depositor','Compte déposant','/admin/consignments/payouts/:sellerId',['ready','payout-dialog','partial','regularization','zero','error']],
 ['clients','Clients','/admin/clients',['ready','client-dialog','client-error','empty','noresults','loading','error','success']],
 ['client','Fiche client','/admin/clients/:sellerId',['ready','client-dialog','relations-error','missing']],
 ['exports','Exports','/admin/exports',['ready','submitting','error','success']],
 ['settings','Paramètres','/admin/settings',['ready','validation','submitting','success','error','signup-disabled']],
 ['auth','Authentification','/login · /register · /forgot-password · /reset-password',['login','register','forgot','reset','validation','submitting','success','expired','signup-disabled']],
 ['catalogue','Catalogue public','/convention',['ready','noresults','image-error','loading','error']],
 ['legal','Informations publiques','/mentions-legales · /confidentialite · /cookies',['legal','privacy','cookies']]
];
const stateLabels={'client-search':'Recherche client · résultats paginés','client-loading':'Recherche client en cours','client-noresults':'Client introuvable','client-search-error':'Erreur de recherche client','client-selected':'Client sélectionné',ready:'Vue normale',loading:'Chargement',empty:'Aucune donnée',error:'Erreur réseau',selected:'Sélection de visibilité',hidden:'Articles masqués',noresults:'Aucun résultat',stale:'Conflit de disponibilité',sold:'Article vendu',missing:'Introuvable',added:'Article ajouté', 'payment-error':'Paiement mixte incomplet','below-agreement':'Prix sous l’accord',submitting:'Enregistrement',success:'Confirmation',pending:'En attente',legacy:'Paiement non renseigné',cancelled:'Vente annulée','payment-dialog':'Formulaire d’encaissement','cancel-dialog':'Confirmation d’annulation',validation:'Champs invalides','lookup-loading':'Recherche catalogue','lookup-error':'Catalogue indisponible','client-dialog':'Formulaire client','client-error':'Client invalide','upload-error':'Pièce jointe échouée','document-error':'Document indisponible',overdue:'Échéance dépassée','agreement-dialog':'Nouvel accord','agreement-error':'Autorisation manquante','return-dialog':'Restitution à confirmer',returned:'Article restitué','payout-dialog':'Formulaire de versement','payout-error':'Versement trop élevé',regularization:'Solde négatif',partial:'Versement partiel',zero:'Solde nul','relations-error':'Historique indisponible','signup-disabled':'Inscription désactivée',login:'Connexion',register:'Créer un compte',forgot:'Mot de passe oublié',reset:'Nouveau mot de passe',expired:'Lien expiré','image-error':'Photo indisponible',legal:'Mentions légales',privacy:'Confidentialité',cookies:'Cookies'};
let page='stock',state='ready',device='desktop',basket=1,selected=0,toast='',lastFocus=null,confirmedPending=false;
const pageSelect=document.getElementById('page-picker'), stateSelect=document.getElementById('state-picker');
pageSelect.innerHTML=pages.map((p,i)=>`<option value="${p[0]}">${i?String(i).padStart(2,'0')+' · ':''}${p[1]}</option>`).join('');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,kind='')=>`<button type="button" class="action ${kind}" data-action="${action}">${label}</button>`;
const go=(label,dest,kind='')=>button(label,'go:'+dest,kind);
const badge=(label,kind='')=>`<span class="badge ${kind}">${label}</span>`;
const note=(title,body,kind='info')=>`<div class="note ${kind}" ${kind==='error'?'role="alert"':'role="status"'}><strong>${title}</strong>${body}</div>`;
const field=(label,value='',type='text',error='',id='')=>`<label class="field ${error?'invalid':''}">${label}<input ${id?`id="${id}"`:''} type="${type}" value="${esc(value)}" ${error?'aria-invalid="true"':''} ${state==='submitting'?'disabled':''}>${error?`<small>${error}</small>`:''}</label>`;
const select=(label,options,id='')=>`<label class="field">${label}<select ${id?`id="${id}"`:''}>${options.map(x=>`<option>${x}</option>`).join('')}</select></label>`;
const textarea=(label,value='',error='')=>`<label class="field ${error?'invalid':''}">${label}<textarea ${error?'aria-invalid="true"':''}>${value}</textarea>${error?`<small>${error}</small>`:''}</label>`;
const summary=(label,value,big=false)=>`<div class="total ${big?'big':''}"><span>${label}</span><strong class="number">${value}</strong></div>`;
const thumb=(tone='',large=false)=>`<div class="thumb ${tone} ${large?'large':''}" aria-label="Illustration de carte fictive">C</div>`;

function payouts(){return heading('Reversements','Enregistrer les sommes déjà versées aux déposants.',go('Dossiers','deposits','quiet'))+(state==='success'?note('Versement enregistré','Le solde du déposant a été mis à jour. Aucun virement n’a été déclenché.','success'):'')+`<div class="pilltabs">${[['ready','À payer'],['empty','Soldés'],['regularization','Régularisations']].map(x=>`<button data-action="state:${x[0]}" class="${state===x[0]?'selected':''}">${x[1]}</button>`).join('')}</div>`+(state==='empty'?empty('Aucune somme à reverser','Les soldes sont à jour. Les paiements restent consultables.',go('Compte déposant','depositor','primary')):generalState()||`<div class="metric dark" style="margin-bottom:17px"><small>${state==='regularization'?'Régularisation à suivre':'Total des soldes positifs'}</small><strong>${state==='regularization'?'−35,00 €':'210,00 €'}</strong><small>${state==='regularization'?'Compensation par de futures ventes':'2 déposants'}</small></div>${records([['Camille Martin',state==='regularization'?'Vente annulée après versement':'Parts éligibles : 315 € · déjà versé : 210 €',badge(state==='regularization'?'Régularisation':'À reverser',state==='regularization'?'red':'gold'),state==='regularization'?'−35,00 €':'105,00 €',go('Compte','depositor','quiet')],...(state==='regularization'?[]:[['Alex Bernard','Parts éligibles : 175 € · déjà versé : 70 €',badge('À reverser','gold'),'105,00 €',go('Compte','depositor','quiet')]])])}${state==='regularization'?note('Aucun versement négatif','Le solde sera compensé par de futures parts éligibles.'): `<div class="actions" style="margin-top:17px">${button('Enregistrer un versement','state:payout-dialog','primary')}</div>`}`);}
function depositor(){return heading('Compte de Camille Martin','Tous les dossiers · tous les reversements',go('Reversements','payouts','quiet'))+(generalState()||`${state==='regularization'?note('Solde à régulariser','Une vente annulée a laissé un solde négatif. Les versements déjà effectués restent conservés.','error'):''}<div class="metrics"><div class="metric dark"><small>${state==='regularization'?'Régularisation':'Reste à reverser'}</small><strong>${state==='regularization'?'−35,00 €':state==='zero'?'0,00 €':state==='partial'?'55,00 €':'105,00 €'}</strong></div><div class="metric"><small>Déjà versé</small><strong>${state==='zero'?'315':state==='partial'?'260':'210'},00 €</strong></div></div>${!['regularization','zero'].includes(state)?`<div class="actions" style="margin-bottom:18px">${button('Enregistrer un versement','state:payout-dialog','primary')}</div>`:''}<div class="panel"><h2>Parts issues des ventes</h2>${records([['Display Riftbound','Vente encaissée · 18 nov.',badge('Éligible','green'),'105,00 €',go('Vente','sale','quiet')],['Coffret collection','Vente à encaisser',badge('Non éligible','gold'),'70,00 €']])}<small>Les ventes à encaisser ne font pas encore partie du solde.</small></div><div class="panel"><h2>Historique des versements</h2>${summary('15 nov. · virement · DEMO-15','210,00 €')}${state==='partial'?summary('18 nov. · virement · DEMO-18','50,00 €'):''}<small>Versements au déposant, sans affectation article par article.</small></div>`);}
function clients(){return heading('Clients','Vos vendeurs et déposants, au même endroit.',button('Nouveau client','state:client-dialog','primary'))+toolbar('Nom, email, téléphone…',['Tous les clients'])+(state==='success'?note('Client enregistré','La fiche peut être utilisée pour un rachat ou un dépôt.','success'):'')+(state==='empty'?empty('Votre carnet commence ici','Créez une fiche avant un rachat ou un dépôt.',button('Nouveau client','state:client-dialog','primary')):state==='noresults'?empty('Aucun client trouvé','Vérifiez le nom ou créez une nouvelle fiche.',button('Nouveau client','state:client-dialog','primary')):generalState()||records([['Camille Martin','camille@example.test · +32 470 00 00 01',badge('Déposant'),'',go('Fiche','client','quiet')],['Alex Bernard','alex@example.test · +32 470 00 00 02',badge('Vendeur'),'',go('Fiche','client','quiet')],['Lou Dubois','lou@example.test · +32 470 00 00 03','', '',go('Fiche','client','quiet')]]));}

function exports(){return heading('Exports','Un classeur pour consulter et rapprocher vos opérations.')+`${state==='error'?note('Export interrompu','Aucun fichier complet n’a été produit. Vous pouvez réessayer.','error'):''}${state==='success'?note('Export prêt · simulation','Le prototype montre la confirmation. Aucun fichier comptable n’est généré.','success'):''}<div class="panel"><div class="eyebrow">Excel · .xlsx</div><h2>Toutes vos données métier</h2><p class="muted">Le périmètre actuel complet, sans filtre de période.</p><hr class="divider"><div class="stack"><div><h3>Stock acheté</h3><small>Achats · Ventes · Stock</small></div><div><h3>Dépôts-ventes</h3><small>Dépôts · Commissions · Reversements · Soldes déposants</small></div><div><h3>Références</h3><small>Clients · Métadonnées d’export</small></div></div><hr class="divider">${button(state==='submitting'?'Préparation du classeur…':'Télécharger Excel','submit','primary')}</div>${note('Rachats et dépôts restent séparés','L’export ne constitue pas une déclaration comptable et ne calcule pas le régime de TVA des commissions.')}`;}
function settings(){return heading('Paramètres','Votre identité de signataire et les préférences de l’instance.')+`${device==='mobile'?note('Parité mobile proposée','Le signataire et les inscriptions sont des réglages web existants. Leur écran mobile est une proposition, pas une fonctionnalité déjà livrée.'):''}${state==='success'?note('Profil enregistré','Les prochains bordereaux utiliseront ces informations.','success'):''}${state==='error'?note('Profil non enregistré','Les valeurs saisies sont conservées. Réessayez.','error'):''}<div class="panel"><h2>Mon signataire</h2><p class="muted">Personnel à votre compte · signatures manuscrites sur les documents.</p><div class="fields" style="margin-top:17px">${field('Prénom',state==='validation'?'':'Émilie','text',state==='validation'?'Indiquez votre prénom.':'')}${field('Nom','Laurent')}<div class="full">${field('Qualité','Gérante')}</div></div>${formfooter('Enregistrer le signataire')}</div><div class="panel"><h2>Création de compte</h2><p class="muted">Ce réglage s’applique à toute l’instance.</p><label class="field" style="display:flex;align-items:center;margin-top:17px"><input class="check" type="checkbox" data-signup ${state==='signup-disabled'?'':'checked'}> Autoriser les nouvelles inscriptions</label><small>${state==='signup-disabled'?'Les nouveaux comptes ne peuvent pas être créés.':'Les visiteurs peuvent créer un compte.'}</small></div>`;}

const demoClients=[
 {id:'CLI-001',name:'Camille Martin',detail:'camille@example.test · +32 470 00 00 01 · Bruxelles'},
 {id:'CLI-002',name:'Alex Martin',detail:'alex@example.test · +32 470 00 00 02 · Namur'},

let clientQuery='',clientOffset=0,chosenClient=null,clientMode='idle';
function clientPicker(label){
 clientQuery=state==='client-search'||state==='client-loading'||state==='client-search-error'?'Martin':state==='client-noresults'?'Introuvable':'';
 clientOffset=0;chosenClient=state==='client-selected'?demoClients[0]:null;
 clientMode=state==='client-loading'?'loading':state==='client-search-error'?'error':chosenClient?'selected':'idle';
 return `<div class="full client-picker"><label class="field">${label}<input type="search" id="client-search" autocomplete="off" placeholder="Nom, email, téléphone ou référence client…" value="${clientQuery}" aria-describedby="client-search-help"></label><small id="client-search-help">Saisissez au moins 2 caractères pour rechercher un client.</small><div id="client-results" aria-live="polite"></div></div>`;
}
function updateClientResults(){
 const target=document.getElementById('client-results');if(!target)return;
 if(chosenClient){target.innerHTML=`<div class="note success"><strong>Client sélectionné · ${esc(chosenClient.name)}</strong>${esc(chosenClient.id+' · '+chosenClient.detail)}<div style="margin-top:8px"><button class="action" data-client-change>Changer de client</button></div></div>`;return;}
 if(clientQuery.trim().length<2){target.innerHTML='';return;}
 if(clientMode==='loading'){target.innerHTML='<p role="status" aria-busy="true">Recherche des clients…</p>';return;}
 if(clientMode==='error'){target.innerHTML='<div class="note error" role="alert"><strong>Recherche indisponible</strong>Le formulaire est conservé. <button class="action" data-client-retry>Réessayer</button></div>';return;}
 const matches=demoClients.filter(c=>(c.name+' '+c.detail+' '+c.id).toLocaleLowerCase().includes(clientQuery.trim().toLocaleLowerCase()));
 if(!matches.length){target.innerHTML='<div class="note info"><strong>Aucun client trouvé</strong>Modifiez votre recherche ou créez une fiche avec « Nouveau client ».</div>';return;}
 const visible=matches.slice(clientOffset,clientOffset+2);
 target.innerHTML=`<div class="rows" style="margin-top:10px">${visible.map(c=>`<div class="row"><div class="grow"><strong>${esc(c.name)}</strong><small>${esc(c.id+' · '+c.detail)}</small></div><button class="action" data-client-pick="${c.id}">Choisir</button></div>`).join('')}</div><nav class="foot" aria-label="Pages des résultats clients"><span>${clientOffset+1}–${Math.min(clientOffset+2,matches.length)} sur ${matches.length} · 2 par page (démo)</span><div class="actions"><button class="action" data-client-page="-1" ${clientOffset===0?'disabled':''}>Précédent</button><button class="action" data-client-page="1" ${clientOffset+2>=matches.length?'disabled':''}>Suivant</button></div></nav>`;
}
function paginateCollections(){
 if(!['stock','sell','sales','conflicts','purchases','purchase','deposits','deposit','payouts','depositor','clients','client','catalogue'].includes(page))return;
 product.querySelectorAll('.content .rows:not([aria-busy]),.content .productgrid').forEach((container,index)=>{
  const rows=[...container.children];if(!rows.length)return;
  const pager=document.createElement('nav');pager.className='foot';pager.setAttribute('aria-label','Pagination de la liste '+(index+1));container.after(pager);
  let current=0,size=2;
  const paint=()=>{
   const query=(product.querySelector('[data-search]')?.value||'').trim().toLocaleLowerCase();
   const filter=product.querySelector('[data-filter]')?.value||'';
   const origin=['Rachats','Dépôts'].includes(filter)?filter.slice(0,-1):'';
   const matches=rows.filter(r=>{const text=(r.dataset.searchable||r.textContent).toLocaleLowerCase();return text.includes(query)&&(!origin||text.includes(origin.toLocaleLowerCase()));});
   current=Math.min(current,Math.max(0,Math.ceil(matches.length/size)-1));
   rows.forEach(r=>r.hidden=true);matches.slice(current*size,(current+1)*size).forEach(r=>r.hidden=false);
   pager.innerHTML=`<span aria-live="polite">${matches.length?current*size+1:0}–${Math.min((current+1)*size,matches.length)} sur ${matches.length}</span><label>Par page (démo) <select aria-label="Nombre par page"><option ${size===2?'selected':''}>2</option><option ${size===5?'selected':''}>5</option></select></label><div class="actions"><button class="action" data-prev ${current===0?'disabled':''}>Précédent</button><span>Page ${current+1}</span><button class="action" data-next ${(current+1)*size>=matches.length?'disabled':''}>Suivant</button></div>`;
   pager.querySelector('[data-prev]').onclick=()=>{current--;paint();};pager.querySelector('[data-next]').onclick=()=>{current++;paint();};pager.querySelector('select').onchange=e=>{size=Number(e.target.value);current=0;paint();};
  };
  container.refreshPagination=()=>{current=0;paint();};paint();
 });
}
root.addEventListener('input',e=>{
 if(e.target.id==='client-search'){clientQuery=e.target.value;clientOffset=0;chosenClient=null;clientMode='idle';updateClientResults();}
 if(e.target.matches('[data-search]'))queueMicrotask(()=>product.querySelectorAll('.rows,.productgrid').forEach(c=>c.refreshPagination?.()));
});
root.addEventListener('change',e=>{if(e.target.matches('[data-filter]'))queueMicrotask(()=>product.querySelectorAll('.rows,.productgrid').forEach(c=>c.refreshPagination?.()));});
root.addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-client-pick')){chosenClient=demoClients.find(c=>c.id===b.dataset.clientPick);updateClientResults();document.querySelector('[data-client-change]')?.focus();}
 if(b.hasAttribute('data-client-change')){chosenClient=null;clientQuery='';clientMode='idle';const input=document.getElementById('client-search');input.value='';updateClientResults();input.focus();}
 if(b.hasAttribute('data-client-page')){clientOffset+=Number(b.dataset.clientPage)*2;updateClientResults();}
 if(b.hasAttribute('data-client-retry')){clientMode='idle';updateClientResults();}
});
function enhanceView(){
 updateClientResults();paginateCollections();

 if(['purchase-new','deposit-new'].includes(page)&&state!=='success'){

  const editor=panels[1];

   location.insertAdjacentHTML('beforebegin',`<details ${page==='purchase-new'?'open':''}><summary>Recherche de carte · saisie manuelle</summary><div class="fields">${field('Nom ou numéro à rechercher','Dracaufeu 199/165')}${select('Catalogue',['Pokémon','Riftbound'])}</div><div class="actions" style="margin-top:10px">${button('Rechercher','lookup')}${button('Saisie manuelle','manual','quiet')}</div>${state==='lookup-loading'||state==='lookup-error'?'':`<div class="row">${thumb()}<div class="grow"><strong>Dracaufeu ex · 199/165</strong><small>Écarlate et Violet 151 · FR</small></div>${button('Choisir','choose-card')}</div>`}</details><details><summary>Carte gradée · certificat (facultatif)</summary><div class="fields">${select('Certification',['Non gradée','PSA','Collect Aura','PCA','CCC Grading'])}${field('Note','9','number')}${field('Numéro du certificat','DEMO-123456')}${field('Référence de la carte','199/165')}</div></details>`);
  }
 }
}

pageSelect.addEventListener('change',()=>navigate(pageSelect.value));stateSelect.addEventListener('change',()=>{lastFocus=stateSelect;setState(stateSelect.value)});document.getElementById('device-picker').addEventListener('change',e=>{device=e.target.value;render()});
root.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;lastFocus=b;if(a.startsWith('go:'))return navigate(a.slice(3));if(a.startsWith('state:'))return setState(a.slice(6));if(a.startsWith('legal:'))return navigate('legal',a.slice(6));if(a==='close'){state=pages.find(x=>x[0]===page)[3][0];render();stateSelect.focus();return;}if(a==='add'){basket++;if(page==='sell')state='added';toast='Article ajouté au panier de démonstration.';}else if(a==='hide'){state='hidden';selected=0;}else if(a==='toggle-hidden'){state=state==='hidden'?'ready':'hidden';}else if(a==='submit'||a==='auth-submit'){if(state==='validation'){toast='Corrigez les champs signalés avant de poursuivre.';return;}if(a==='auth-submit'&&state==='login')return navigate('dashboard');state=pages.find(x=>x[0]===page)[3].includes('success')?'success':'ready';toast='Résultat simulé : aucune donnée enregistrée.';}else if(a==='confirm-sale'){const cash=Number(document.getElementById('cash')?.value||0),transfer=Number(document.getElementById('transfer')?.value||0);if(state==='below-agreement')return;if(state==='stale')return setState('ready');const mode=document.getElementById('payment-method').value;confirmedPending=mode==='À encaisser';if(!confirmedPending&&Math.round((cash+transfer)*100)!==27000)return setState('payment-error');basket=0;state='success';}else if(a==='payout-submit'){const n=Number(document.getElementById('payout-amount')?.value||0);if(n<=0||n>105){if(page==='payouts')state='payout-error';else{toast='Le versement doit être compris entre 0,01 € et 105,00 €.';return;}}else if(page==='depositor')state='partial';else state='success';}else if(a==='agreement-submit'){if(!product.querySelector('.dialog textarea').value.trim())state='agreement-error';else{state='ready';toast='Nouvel accord simulé : 130 € · commission 30 % · part 91 €.';}}else if(a==='return-submit'){state='returned';}else if(a==='cancel-submit'){if(page==='purchase')return navigate('purchases');state='cancelled';}else if(a==='dialog-submit'){const first=product.querySelector('.dialog input');if(!first?.value.trim()){if(page==='clients')state='client-error';else{first.setAttribute('aria-invalid','true');first.focus();return;}}else{state='ready';toast='Formulaire validé dans la maquette. Le contexte de la page est conservé.';}}else if(a==='more'){toast='Plus : Clients · Compte · Catalogue public';product.querySelector('.content').innerHTML=heading('Plus','Vos autres espaces')+records([['Clients','Vendeurs et déposants','','',go('Ouvrir','clients')],['Compte','Réglages proposés sur mobile','','',go('Ouvrir','settings')],['Catalogue public','La collection visible','','',go('Ouvrir','catalogue')]]);return;}else if(a==='add-line'){const target=document.getElementById('extra-lines');target.innerHTML+=`<div style="margin-top:15px">${field('Article supplémentaire','')}${field('Prix (€)','','number')}</div>`;return;}else if(a==='upload'){toast='Zone de justificatif proposée : fichier privé, conservé avec le dossier.';}else if(a==='retry-upload'){state='ready';toast='Nouvelle tentative d’envoi simulée. Aucun dossier supplémentaire créé.';}else if(a==='document'){toast='Aperçu de téléchargement : les PDF réels restent générés par l’application.';}else{toast='Action simulée dans la maquette.';}render();});
root.addEventListener('input',e=>{if(e.target.matches('[data-search]')){const term=e.target.value.toLocaleLowerCase();product.querySelectorAll('[data-filter-row]').forEach(r=>r.hidden=!r.dataset.searchable.toLocaleLowerCase().includes(term));}if(['cash','transfer'].includes(e.target.id)){const total=Number(document.getElementById('cash').value||0)+Number(document.getElementById('transfer').value||0);document.getElementById('payment-feedback').textContent=`Total reçu : ${total.toFixed(2).replace('.',',')} € / 270,00 €`;document.getElementById('payment-feedback').classList.toggle('invalid-feedback',Math.round(total*100)!==27000);}});
root.addEventListener('change',e=>{if(e.target.matches('.check:not([data-signup])')){selected=product.querySelectorAll('.row .check:checked').length;if(selected)setState('selected');else setState('ready');}if(e.target.matches('[data-signup]'))setState(e.target.checked?'ready':'signup-disabled');if(e.target.matches('[data-filter]')){const v=e.target.value;if(v==='Masqués'&&page==='stock')setState('hidden');else if(v==='Visibles'&&page==='stock')setState('ready');else if(v==='En attente'&&page==='purchases')setState('pending');else if(v==='Échéance dépassée'&&page==='deposits')setState('overdue');else{product.querySelectorAll('[data-filter-row]').forEach(r=>r.hidden=!v.startsWith('Tous')&&!r.dataset.searchable.includes(v.replace(/s$/,'')));}}});
root.addEventListener('keydown',e=>{const d=product.querySelector('.dialog');if(!d)return;if(e.key==='Escape'){state=pages.find(x=>x[0]===page)[3][0];render();stateSelect.focus();}if(e.key==='Tab'){const items=[...d.querySelectorAll('button,input,select,textarea')].filter(x=>!x.disabled);if(e.shiftKey&&document.activeElement===items[0]){e.preventDefault();items.at(-1).focus();}else if(!e.shiftKey&&document.activeElement===items.at(-1)){e.preventDefault();items[0].focus();}}});
root.addEventListener('change',e=>{
 if(e.target.id!=='payment-method')return;
 const mode=e.target.value,cash=document.getElementById('cash'),transfer=document.getElementById('transfer'),feedback=document.getElementById('payment-feedback');
 cash.disabled=mode==='Virement'||mode==='À encaisser';transfer.disabled=mode==='Espèces'||mode==='À encaisser';
 cash.value=mode==='Espèces'?'270.00':mode==='Mixte'?'120.00':'0.00';transfer.value=mode==='Virement'?'270.00':mode==='Mixte'?'150.00':'0.00';
 feedback.classList.remove('invalid-feedback');feedback.textContent=mode==='À encaisser'?'270,00 € resteront à encaisser. Aucun paiement reçu.':'Total reçu : 270,00 € / 270,00 €';
});
render();
if(globalThis.Tweak){const options={radius:14};const tweak=new Tweak({container:product,onChange:()=>root.style.setProperty('--c-radius',options.radius+'px')});tweak.addSlider(options,'radius',{label:'Rayon des panneaux',min:6,max:22,unit:'px'});}
window.cartelitesMockup={pages:pages.map(p=>({id:p[0],title:p[1],states:p[3]})),navigate,setState,setDevice:(value)=>{device=value==='mobile'?'mobile':'desktop';document.getElementById('device-picker').value=device;render();},getState:()=>({page,state,device})};
window.mockupAtlas=window.cartelitesMockup;
})();
</script>
</body>
</html>
