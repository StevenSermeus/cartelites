#atelier .mobile .inventory-list .inventory-row{border-bottom:1px solid var(--c-line);padding:14px 12px;display:flex;align-items:center;gap:12px;margin:0;border-radius:0}
#atelier .mobile .inventory-list .inventory-row:last-child{border:0}
#atelier .mobile .inventory-copy{min-width:0;flex:1}#atelier .mobile .inventory-copy strong{display:block;font-size:16px;line-height:1.3;overflow-wrap:anywhere}#atelier .mobile .inventory-copy small{display:block;margin-top:4px;font-size:12px}
#atelier .mobile .inventory-art{width:46px;height:58px;flex:0 0 46px;border-radius:10px;background:var(--c-canvas);display:grid;place-items:center;color:var(--c-muted);overflow:hidden}#atelier .mobile .inventory-art img{width:100%;height:100%;object-fit:contain}
#atelier .mobile .inventory-art svg{width:27px;height:27px}
#atelier .mobile .inventory-row .action{padding:10px!important;flex-shrink:0;font-size:14px!important}
#atelier .mobile .inventory-price{color:var(--c-ink);font-weight:600;margin-top:6px;font-size:15px}
#atelier .mobile .back-link{order:-1;align-self:flex-start;padding-left:0!important;min-height:44px}
#atelier .mobile .dialog{max-height:730px;overflow:auto}#atelier .mobile .modalstage{inset:0;align-items:flex-end;padding:24px 8px 8px}
#atelier .mobile .photo-choice{position:relative;cursor:pointer}#atelier .mobile .photo-choice input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}#atelier .mobile .photo-choice:focus-within{outline:3px solid var(--c-brown);outline-offset:3px}
@media(prefers-reduced-motion:reduce){#atelier *{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div id="atelier">
 <div class="inspect" aria-label="Explorer les maquettes">
  <label>Page<select id="page-picker" aria-label="Page de la maquette"></select></label>
  <label>État<select id="state-picker" aria-label="État de la page"></select></label>
  <label class="device">Format<select id="device-picker" aria-label="Format"><option value="mobile">Mobile</option></select></label>
 </div>
 <div id="product" class="app"></div>
 <div class="statecaption"><strong id="coverage"></strong><span>Prototype · données fictives · aucune opération réelle</span></div>
</div>
<script>
(()=>{'use strict';
const root=document.getElementById('atelier'), product=document.getElementById('product');
const pages=[
 ['connection','Connexion à une instance','Mobile / instance',['setup','url-filled','testing','connected','url-invalid','unreachable','incompatible','switch-confirm','storage-error']],
 ['base','Fondations','Design system',['ready']],
 ['dashboard','Vue d’ensemble','/admin/dashboard',['ready','loading','empty','error']],
 ['stock','Stock','/admin/stock',['ready','selected','hidden','empty','noresults','loading','error','stale']],
 ['item','Article','/admin/stock/:itemId',['ready','hidden','sold','missing','error']],
 ['sell','Nouvelle vente','/admin/sales',['ready','added','empty','noresults','loading','error']],
 ['cart','Panier et confirmation','/admin/sales/cart',['ready','payment-error','below-agreement','stale','submitting','success','empty']],
 ['sales','Historique des ventes','/admin/sales/history',['ready','pending','legacy','cancelled','payment-dialog','empty','noresults','loading','error']],
 ['sale','Vente','/admin/sales/history/:saleId',['ready','pending','payment-dialog','cancel-dialog','cancelled','error']],
 ['conflicts','Conflits de vente','/admin/sales/conflicts',['ready','empty','stale','error','success']],
 ['purchases','Rachats','/admin/purchase-history',['ready','pending','empty','noresults','loading','error']],
 ['purchase-new','Nouveau rachat','/admin/purchases',['ready','client-search','client-loading','client-noresults','client-search-error','client-selected','validation','lookup-loading','lookup-error','client-dialog','submitting','success','upload-error']],
 ['purchase','Rachat','/admin/purchase-history/:purchaseId',['ready','pending','cancel-dialog','success','document-error','missing']],
 ['deposits','Dossiers de dépôt','/admin/consignments',['ready','overdue','empty','noresults','loading','error']],
 ['deposit-new','Nouveau dépôt','/admin/consignments/new',['ready','client-search','client-loading','client-noresults','client-search-error','client-selected','validation','client-dialog','submitting','success','upload-error']],
 ['deposit','Dossier de dépôt','/admin/consignments/:consignmentId',['ready','agreement-dialog','agreement-error','return-dialog','returned','sold','stale','upload-error']],
 ['payouts','Reversements','/admin/consignments/payouts',['ready','payout-dialog','payout-error','regularization','empty','loading','error','success']],
 ['depositor','Compte déposant','/admin/consignments/payouts/:sellerId',['ready','payout-dialog','partial','regularization','zero','error']],
 ['clients','Clients','/admin/clients',['ready','client-dialog','client-error','empty','noresults','loading','error','success']],
 ['client','Fiche client','/admin/clients/:sellerId',['ready','client-dialog','relations-error','missing']],
 ['exports','Exports','/admin/exports',['ready','submitting','error','success']],
 ['settings','Paramètres','/admin/settings',['ready','validation','submitting','success','error','signup-disabled']],
 ['auth','Authentification','/login · /register · /forgot-password · /reset-password',['login','register','forgot','reset','validation','submitting','success','expired','signup-disabled']],
 ['catalogue','Catalogue web de l’instance','/convention',['ready','noresults','image-error','loading','error']],
 ['legal','Informations du site web','/mentions-legales · /confidentialite · /cookies',['legal','privacy','cookies']]
];
const stateLabels={'storage-error':'Enregistrement local impossible',setup:'Première ouverture','url-filled':'Adresse renseignée',testing:'Vérification en cours',connected:'Instance reconnue','url-invalid':'Adresse invalide',unreachable:'API inaccessible',incompatible:'API incompatible','switch-confirm':'Changer d’instance','client-search':'Recherche client · résultats paginés','client-loading':'Recherche client en cours','client-noresults':'Client introuvable','client-search-error':'Erreur de recherche client','client-selected':'Client sélectionné',ready:'Vue normale',loading:'Chargement',empty:'Aucune donnée',error:'Erreur réseau',selected:'Sélection de visibilité',hidden:'Articles masqués',noresults:'Aucun résultat',stale:'Conflit de disponibilité',sold:'Article vendu',missing:'Introuvable',added:'Article ajouté', 'payment-error':'Paiement mixte incomplet','below-agreement':'Prix sous l’accord',submitting:'Enregistrement',success:'Confirmation',pending:'En attente',legacy:'Paiement non renseigné',cancelled:'Vente annulée','payment-dialog':'Formulaire d’encaissement','cancel-dialog':'Confirmation d’annulation',validation:'Champs invalides','lookup-loading':'Recherche catalogue','lookup-error':'Catalogue indisponible','client-dialog':'Formulaire client','client-error':'Client invalide','upload-error':'Pièce jointe échouée','document-error':'Document indisponible',overdue:'Échéance dépassée','agreement-dialog':'Nouvel accord','agreement-error':'Autorisation manquante','return-dialog':'Restitution à confirmer',returned:'Article restitué','payout-dialog':'Formulaire de versement','payout-error':'Versement trop élevé',regularization:'Solde négatif',partial:'Versement partiel',zero:'Solde nul','relations-error':'Historique indisponible','signup-disabled':'Inscription désactivée',login:'Connexion',register:'Créer un compte',forgot:'Mot de passe oublié',reset:'Nouveau mot de passe',expired:'Lien expiré','image-error':'Photo indisponible',legal:'Mentions légales',privacy:'Confidentialité',cookies:'Cookies'};
let page='connection',state='setup',device='mobile',basket=1,selected=0,toast='',lastFocus=null,confirmedPending=false;
const pageSelect=document.getElementById('page-picker'), stateSelect=document.getElementById('state-picker');
pageSelect.innerHTML=pages.map((p,i)=>`<option value="${p[0]}">${i?String(i).padStart(2,'0')+' · ':''}${p[1]}</option>`).join('');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,kind='')=>`<button type="button" class="action ${kind}" data-action="${action}">${label}</button>`;
const go=(label,dest,kind='')=>button(label,'go:'+dest,kind);
const badge=(label,kind='')=>`<span class="badge ${kind}">${label}</span>`;
const note=(title,body,kind='info')=>`<div class="note ${kind}" ${kind==='error'?'role="alert"':'role="status"'}><strong>${title}</strong>${body}</div>`;
const field=(label,value='',type='text',error='',id='')=>`<label class="field ${error?'invalid':''}">${label}<input ${id?`id="${id}"`:''} type="${type}" value="${esc(value)}" ${error?'aria-invalid="true"':''} ${state==='submitting'?'disabled':''}>${error?`<small>${error}</small>`:''}</label>`;
const select=(label,options,id='')=>`<label class="field">${label}<select ${id?`id="${id}"`:''}>${options.map(x=>`<option>${x}</option>`).join('')}</select></label>`;
const textarea=(label,value='',error='')=>`<label class="field ${error?'invalid':''}">${label}<textarea ${error?'aria-invalid="true"':''}>${value}</textarea>${error?`<small>${error}</small>`:''}</label>`;
const summary=(label,value,big=false)=>`<div class="total ${big?'big':''}"><span>${label}</span><strong class="number">${value}</strong></div>`;
const thumb=(tone='',large=false)=>`<div class="thumb ${tone} ${large?'large':''}" aria-label="Illustration de carte fictive">C</div>`;
const loading=()=>`<div class="rows" aria-label="Chargement en cours" aria-busy="true">${[1,2,3,4].map(()=>'<div class="loadingrow"><div class="skeleton"></div><div class="skeleton"></div></div>').join('')}</div>`;
const empty=(title,body,action)=>`<div class="empty"><div class="orb" aria-hidden="true">—</div><h2>${title}</h2><p>${body}</p><div class="actions">${action||button('Réinitialiser','state:ready','primary')}</div></div>`;
const toolbar=(placeholder,opts=['Tous','Rachats','Dépôts'])=>`<div class="toolbar"><input aria-label="Rechercher" data-search placeholder="${placeholder}" value="${state==='noresults'?'Recherche introuvable':''}"><select aria-label="Filtrer" data-filter>${opts.map(x=>`<option>${x}</option>`).join('')}</select></div>`;
const formfooter=(label='Enregistrer',action='submit')=>`<div class="actions" style="justify-content:flex-end;margin-top:17px">${button('Annuler','state:ready')}${button(state==='submitting'?'Enregistrement…':label,action,'primary')}</div>`;
const footer=()=>`<div class="publicfooter">${button('Mentions légales','legal:legal','quiet')}${button('Confidentialité','legal:privacy','quiet')}${button('Cookies','legal:cookies','quiet')}</div>`;
const products=[['Dracaufeu ex','Pokémon · 199/165 · FR','Rachat','120,00 €',''],['Display Riftbound','Produit scellé · FR','Dépôt','150,00 €','blue'],['Pikachu · PSA 9','Pokémon · 025 · EN','Rachat','85,00 €','gold']];
function productRows(selling=false){return `<div class="rows">${products.map((p,i)=>`<div class="row" data-filter-row data-searchable="${p[0]} ${p[2]}">${!selling?`<input class="check" type="checkbox" aria-label="Sélectionner ${p[0]} pour la visibilité" ${state==='selected'?'checked':''}>`:''}${thumb(p[4])}<div class="grow"><strong>${p[0]}</strong><small>${p[1]}</small><div class="meta">${badge(p[2])}${!selling?badge(state==='hidden'?'Masqué':'Visible',state==='hidden'?'gray':'green'):''}</div></div><div class="price">${p[3]}</div>${selling?button(state==='added'&&i===0?'Ajouté':'Ajouter','add',''):go('Voir','item','quiet')}</div>`).join('')}</div>`}
function records(rows){return `<div class="rows">${rows.map(r=>`<div class="row" data-filter-row data-searchable="${r[0]} ${r[1]}"><div class="grow"><strong>${r[0]}</strong><small>${r[1]}</small>${r[2]?`<div class="meta">${r[2]}</div>`:''}</div><span class="price">${r[3]||''}</span>${r[4]||''}</div>`).join('')}</div>`}
function heading(title,sub='',action=''){return `<div class="heading"><div><div class="eyebrow">${['catalogue','legal'].includes(page)?'Site de l’instance':'Espace vendeur'}</div><h1>${title}</h1>${sub?`<p>${sub}</p>`:''}</div>${action}</div>`}
function generalState(){const family=pages.find(p=>p[0]===page)[1];if(state==='loading')return loading();if(state==='error'&&!['settings','exports','conflicts'].includes(page))return empty(`${family} indisponible`,'La connexion a été interrompue. Aucune opération n’a été confirmée.',button('Réessayer','state:ready','primary'));if(state==='missing')return empty('Ce dossier est introuvable','Vérifiez le lien ou revenez à la liste. Aucune donnée n’est modifiée.',go('Retour à la liste',page==='client'?'clients':page==='purchase'?'purchases':'stock','primary'));return '';}
function base(){return heading('Une base calme, précise.','La collection au premier plan. Les décisions toujours lisibles.')+`<div class="panel"><div class="eyebrow">Application mobile · fondations</div><h2>Une application commune à toutes les instances</h2><div class="swatchwrap"><div class="swatches">${[['#0066cc','Action'],['#e9f2ff','Accent'],['#f2f2f7','Fond'],['#ffffff','Surface'],['#1c1c1e','Texte']].map(x=>`<div class="swatch" style="background:${x[0]}"><small>${x[1]}</small></div>`).join('')}</div></div><h1>Votre stock, en confiance.</h1><p class="muted" style="margin-top:8px">Titres nets, chiffres alignés, contexte discret.</p></div><div class="panel"><h2>Actions et états</h2><div class="actions">${button('Action principale','demo','primary')}${button('Action secondaire','demo')}${button('Annuler une vente','demo','danger')}</div><div class="actions" style="margin-top:15px">${badge('Disponible','green')}${badge('En attente','gold')}${badge('Masqué','gray')}${badge('Conflit','red')}</div></div><div class="panel"><h2>Un formulaire, une décision</h2><div class="fields">${field('Prix convenu (€)','150.00','number')}${field('Référence','DEP-2026-041')}</div></div>`+note('Contexte toujours visible','Origine, disponibilité, visibilité publique et encaissement restent quatre informations distinctes.');}
function dashboard(){return heading('Vue d’ensemble','Mercredi 18 novembre · une lecture claire de votre activité',go('Nouvelle vente','sell','primary'))+(state==='empty'?empty('Votre activité commence ici','Les indicateurs apparaîtront après vos premières opérations.',go('Créer un rachat','purchase-new','primary')):generalState()||`<div class="metrics"><div class="metric dark"><small>Ventes encaissées · total</small><strong>4 260 €</strong><small>Montants reçus uniquement</small></div><div class="metric"><small>À encaisser</small><strong>270 €</strong>${go('Voir les ventes','sales','quiet')}</div><div class="metric"><small>Gains sur rachats</small><strong>840 €</strong><small>Pertes : 35 €</small></div><div class="metric"><small>Commissions</small><strong>315 €</strong><small>Hors calcul de TVA sur commission</small></div></div><div class="panel"><div class="sectionhead"><h2>Activité récente</h2><span class="badge">6 derniers mois</span></div><div class="legend"><span><i class="dot"></i>Rachats</span><span><i class="dot gold"></i>Ventes</span></div><div class="bars" role="img" aria-label="Données fictives : rachats et ventes mensuels de juin à novembre, ventes progressant de 700 à 1260 euros">${[[30,45],[42,54],[35,60],[51,65],[48,79],[63,90]].map(x=>`<div><span style="height:${x[0]}%"></span><span class="alt" style="height:${x[1]}%"></span></div>`).join('')}</div><div class="chartlabels"><span>Juin</span><span>Juil.</span><span>Août</span><span>Sept.</span><span>Oct.</span><span>Nov.</span></div></div><div class="sectionhead"><h2>À suivre</h2><small>Les prochaines actions</small></div>${records([['2 rachats à valider','Les articles ne sont pas encore en stock.',badge('En attente','gold'),'',go('Ouvrir','purchases','quiet')],['210 € à reverser','2 déposants avec un solde positif.',badge('Reversements'),'',go('Ouvrir','payouts','quiet')]])}`);}
function stock(){return heading('Stock','3 articles disponibles · rachats et dépôts réunis',go('Nouvelle vente','sell','primary'))+toolbar('Nom, numéro, série…',['Tous','Visibles','Masqués'])+(state==='selected'?note('3 articles sélectionnés',`Visibilité publique uniquement. ${button('Masquer la sélection','hide','primary')}`):'')+(state==='hidden'?note('Masqués du catalogue','Ces articles restent disponibles pour une vente interne.'):'')+(state==='stale'?note('La sélection a changé','Un article vient d’être vendu. Aucun changement de visibilité n’a été appliqué.','error'):'')+(state==='empty'?empty('Votre stock est prêt à accueillir ses premières cartes','Enregistrez un rachat ou un dépôt pour commencer.',go('Nouveau rachat','purchase-new','primary')):state==='noresults'?empty('Aucun article ne correspond','Essayez un autre nom ou retirez un filtre.'):generalState()||productRows())+`<div class="foot"><span>Sélection de visibilité · maximum 500 articles</span></div>`;}
function item(){return heading('Dracaufeu ex','Pokémon · Écarlate et Violet 151 · 199/165',go('Retour au stock','stock','quiet'))+(generalState()||`${state==='sold'?note('Article vendu','Cet article ne peut plus être ajouté au panier. Son historique reste disponible.','success'):''}<div class="panel"><div class="summaryline">${thumb('',true)}<div class="stack"><div class="actions">${badge('Rachat')}${badge(state==='sold'?'Vendu':'Disponible',state==='sold'?'gray':'green')}${badge(state==='hidden'?'Masqué':'Visible',state==='hidden'?'gray':'green')}</div><h2>Une provenance documentée</h2><small>Français · Near Mint · non gradée</small>${go('Voir le rachat RAC-2026-038','purchase','quiet')}</div></div></div><div class="split"><div class="panel"><h2>Identité et provenance</h2>${summary('Client source','Camille Martin')}${summary('Entrée en stock','14 nov. 2026')}${summary('Prix de rachat','78,00 €')}<hr class="divider"><h3>Justificatifs privés</h3><small>1 photo · 1 bordereau</small><div class="actions" style="margin-top:12px">${button('Voir le justificatif','document')}</div></div><div class="panel"><div class="stack">${field('Prix demandé (€)','120.00','number')}${button('Enregistrer le prix','price','primary')}${state==='sold'?'':button('Ajouter au panier','add')}${state==='sold'?'':button(state==='hidden'?'Réafficher':'Masquer','toggle-hidden','quiet')}</div></div></div>`);}
function sell(){return heading('Nouvelle vente','Cherchez les articles, puis composez votre panier.',go(`Panier · ${basket}`,'cart','primary'))+toolbar('Rechercher un article…')+(state==='added'?note('Article ajouté au panier','Vous pouvez continuer la sélection ou passer à la confirmation.','success'):'')+(state==='empty'?empty('Aucun article disponible','Le stock ne contient aucun article vendable.',go('Stock','stock','primary')):state==='noresults'?empty('Aucun article trouvé','Le panier existant est conservé. Modifiez votre recherche.'):generalState()||productRows(true));}
function paymentFields(error=false){return `<div class="fields">${select('Encaissement',['Mixte','Espèces','Virement','À encaisser'],'payment-method')}${field('Date de réception','2026-11-18','date')}${field('Espèces (€)',error?'100.00':'120.00','number',error?'Il manque 20,00 € au total.':'','cash')}${field('Virement (€)','150.00','number','','transfer')}<div class="full">${field('Référence (facultatif)','Salon Bruxelles · démo')}</div></div><div id="payment-feedback" class="inline-message" aria-live="polite">${error?'Total reçu : 250,00 € / 270,00 €':'Total reçu : 270,00 € / 270,00 €'}</div>`;}
function cart(){return heading('Vérifier la vente','2 articles · confirmer les prix et l’encaissement',go('Continuer la sélection','sell','quiet'))+(state==='empty'?empty('Votre panier est vide','Choisissez un article dans le stock disponible.',go('Ajouter des articles','sell','primary')):state==='success'?empty('Vente enregistrée',confirmedPending?'270,00 € à encaisser. Les deux articles ont quitté le stock.':'270,00 € encaissés. Les deux articles ont quitté le stock.',go('Voir les ventes','sales','primary')):`${state==='stale'?note('Aucune vente enregistrée','Le Display Riftbound n’est plus disponible. Le panier complet a été refusé ; vos saisies restent visibles.','error'):''}${state==='below-agreement'?note('Un nouvel accord est nécessaire','130,00 € est inférieur aux 150,00 € convenus pour le dépôt. Faites autoriser le nouveau prix avant de vendre. '+go('Modifier l’accord','deposit','quiet'),'error'):''}<div class="panel"><h2>Articles du panier</h2><div class="row">${thumb()}<div class="grow"><strong>Dracaufeu ex</strong><small>Rachat</small></div>${field('Prix (€)','120.00','number')}</div><div class="row">${thumb('blue')}<div class="grow"><strong>Display Riftbound</strong><small>Dépôt · commission 30 %</small></div>${field('Prix (€)',state==='below-agreement'?'130.00':'150.00','number')}</div>${summary('Part du déposant','105,00 €')}${summary('Total à recevoir',state==='below-agreement'?'250,00 €':'270,00 €',true)}</div><div class="panel"><h2>Comment le paiement a-t-il été reçu ?</h2>${paymentFields(state==='payment-error')}<hr class="divider"><small>« À encaisser » conserve la vente en attente de paiement.</small>${formfooter('Confirmer la vente','confirm-sale')}</div>${state==='submitting'?note('Confirmation en cours','Patientez jusqu’à la réponse. Ne relancez pas la vente.') :''}`);}
function sales(){return heading('Historique des ventes','Retrouvez les ventes et les encaissements.',go('Nouvelle vente','sell','primary'))+`<div class="pilltabs">${[['ready','Toutes'],['pending','À encaisser'],['legacy','Non renseigné'],['cancelled','Annulées']].map(x=>`<button class="${state===x[0]?'selected':''}" data-action="state:${x[0]}">${x[1]}</button>`).join('')}</div>`+(state==='empty'?empty('Aucune vente enregistrée','Les ventes confirmées apparaîtront ici.',go('Nouvelle vente','sell','primary')):state==='noresults'?empty('Aucune vente correspondante','Élargissez la période ou retirez un filtre.'):generalState()||records([[state==='cancelled'?'Dracaufeu ex · vente annulée':'Display Riftbound','18 nov. 2026 · VEN-2026-084',badge(state==='pending'?'À encaisser':state==='legacy'?'Non renseigné':state==='cancelled'?'Annulée':'Encaissé',state==='pending'?'gold':state==='cancelled'?'red':state==='legacy'?'gray':'green'),'150,00 €',go('Détails','sale','quiet')],['Pikachu · PSA 9','17 nov. 2026 · VEN-2026-083',badge('Encaissé','green'),'85,00 €',go('Détails','sale','quiet')]])+`<div class="actions" style="margin-top:15px">${button('Renseigner un encaissement','state:payment-dialog')}</div>`);}
function sale(){return heading('Vente VEN-2026-084','18 novembre 2026 · une vente par article',go('Historique','sales','quiet'))+(generalState()||`${state==='cancelled'?note('Vente annulée','Le paiement reçu reste documenté. Cette vente est exclue des totaux actifs.','info'):''}<div class="panel"><div class="summaryline">${thumb('blue')}<div><h2>Display Riftbound</h2><small>Produit scellé · dépôt DEP-2026-041</small></div></div><hr class="divider">${summary('Prix vendu','150,00 €')}${summary('Commission · 30 %','45,00 €')}${summary('Part du déposant','105,00 €')}${go('Ouvrir le dossier de dépôt','deposit','quiet')}</div><div class="panel"><div class="sectionhead"><h2>Encaissement</h2>${badge(state==='pending'?'À encaisser':'Reçu',state==='pending'?'gold':'green')}</div>${state==='pending'?'<p class="muted">Le montant n’est pas encore éligible au reversement.</p>':summary('Virement reçu le 18/11/2026','150,00 €')}${state==='cancelled'?'':`<div class="actions" style="margin-top:15px">${button(state==='pending'?'Enregistrer le paiement':'Corriger le paiement','state:payment-dialog','primary')}</div>`}</div>${state==='cancelled'?'':button('Annuler cette vente','state:cancel-dialog','danger')}`);}

let clientQuery='',clientOffset=0,chosenClient=null,clientMode='idle';
function clientPicker(label){
 clientQuery=state==='client-search'||state==='client-loading'||state==='client-search-error'?'Martin':state==='client-noresults'?'Introuvable':'';
 clientOffset=0;chosenClient=state==='client-selected'?demoClients[0]:null;
 clientMode=state==='client-loading'?'loading':state==='client-search-error'?'error':chosenClient?'selected':'idle';
 return `<div class="full client-picker"><label class="field">${label}<input type="search" id="client-search" autocomplete="off" placeholder="Nom, email, téléphone ou référence client…" value="${clientQuery}" aria-describedby="client-search-help"></label><small id="client-search-help">Saisissez au moins 2 caractères pour rechercher un client.</small><div id="client-results" aria-live="polite"></div></div>`;
}
function updateClientResults(){
 const target=document.getElementById('client-results');if(!target)return;
 if(chosenClient){target.innerHTML=`<div class="note success"><strong>Client sélectionné · ${esc(chosenClient.name)}</strong>${esc(chosenClient.id+' · '+chosenClient.detail)}<div style="margin-top:8px"><button class="action" data-client-change>Changer de client</button></div></div>`;return;}
 if(clientQuery.trim().length<2){target.innerHTML='';return;}
 if(clientMode==='loading'){target.innerHTML='<p role="status" aria-busy="true">Recherche des clients…</p>';return;}
 if(clientMode==='error'){target.innerHTML='<div class="note error" role="alert"><strong>Recherche indisponible</strong>Le formulaire est conservé. <button class="action" data-client-retry>Réessayer</button></div>';return;}
 const matches=demoClients.filter(c=>(c.name+' '+c.detail+' '+c.id).toLocaleLowerCase().includes(clientQuery.trim().toLocaleLowerCase()));
 if(!matches.length){target.innerHTML='<div class="note info"><strong>Aucun client trouvé</strong>Modifiez votre recherche ou créez une fiche avec « Nouveau client ».</div>';return;}
 const visible=matches.slice(clientOffset,clientOffset+2);
 target.innerHTML=`<div class="rows" style="margin-top:10px">${visible.map(c=>`<div class="row"><div class="grow"><strong>${esc(c.name)}</strong><small>${esc(c.id+' · '+c.detail)}</small></div><button class="action" data-client-pick="${c.id}">Choisir</button></div>`).join('')}</div><nav class="foot" aria-label="Pages des résultats clients"><span>${clientOffset+1}–${Math.min(clientOffset+2,matches.length)} sur ${matches.length} · 2 par page (démo)</span><div class="actions"><button class="action" data-client-page="-1" ${clientOffset===0?'disabled':''}>Précédent</button><button class="action" data-client-page="1" ${clientOffset+2>=matches.length?'disabled':''}>Suivant</button></div></nav>`;
}
function paginateCollections(){
 if(!['stock','sell','sales','conflicts','purchases','purchase','deposits','deposit','payouts','depositor','clients','client','catalogue'].includes(page))return;
 product.querySelectorAll('.content .rows:not([aria-busy]),.content .productgrid').forEach((container,index)=>{
  const rows=[...container.children];if(!rows.length)return;
  const pager=document.createElement('nav');pager.className='foot';pager.setAttribute('aria-label','Pagination de la liste '+(index+1));container.after(pager);
  let current=0,size=2;
  const paint=()=>{
   const query=(product.querySelector('[data-search]')?.value||'').trim().toLocaleLowerCase();
   const filter=product.querySelector('[data-filter]')?.value||'';
   const origin=['Rachats','Dépôts'].includes(filter)?filter.slice(0,-1):'';
   const matches=rows.filter(r=>{const text=(r.dataset.searchable||r.textContent).toLocaleLowerCase();return text.includes(query)&&(!origin||text.includes(origin.toLocaleLowerCase()));});
   current=Math.min(current,Math.max(0,Math.ceil(matches.length/size)-1));
   rows.forEach(r=>r.hidden=true);matches.slice(current*size,(current+1)*size).forEach(r=>r.hidden=false);
   pager.innerHTML=`<span aria-live="polite">${matches.length?current*size+1:0}–${Math.min((current+1)*size,matches.length)} sur ${matches.length}</span><label>Par page (démo) <select aria-label="Nombre par page"><option ${size===2?'selected':''}>2</option><option ${size===5?'selected':''}>5</option></select></label><div class="actions"><button class="action" data-prev ${current===0?'disabled':''}>Précédent</button><span>Page ${current+1}</span><button class="action" data-next ${(current+1)*size>=matches.length?'disabled':''}>Suivant</button></div>`;
   pager.querySelector('[data-prev]').onclick=()=>{current--;paint();};pager.querySelector('[data-next]').onclick=()=>{current++;paint();};pager.querySelector('select').onchange=e=>{size=Number(e.target.value);current=0;paint();};
  };
  container.refreshPagination=()=>{current=0;paint();};paint();
 });
}

 (state==='connected'?note('Instance démo reconnue','Adresse : '+esc(url)+'. Connectez-vous avec le compte de cette instance.','success')+'<button class="action primary" data-instance-save>Enregistrer et se connecter</button>':'')+
 (state==='storage-error'?note('Adresse non enregistrée','Le stockage local de ce prototype est indisponible. Réessayez dans un navigateur autorisant le stockage.','error'):'')+
 (state==='unreachable'?note('Impossible de joindre l’API','Vérifiez l’adresse et votre connexion, puis réessayez. L’instance actuelle reste inchangée.','error'):'')+
 (state==='incompatible'?note('Cette adresse ne correspond pas à une API compatible','Demandez l’adresse de l’API, plutôt que celle du site public.','error'):'')+
 (state==='switch-confirm'?note('Changer d’instance ?','Vous serez déconnecté de l’instance actuelle. Les formulaires non enregistrés seront abandonnés. Aucun jeton ne sera transmis à la nouvelle adresse.')+`<div class="actions"><button class="action" data-instance-cancel>Rester sur cette instance</button><button class="action primary" data-instance-switch>Changer et se reconnecter</button></div>`:'')+

e==='purchase')return navigate('purchases');state='cancelled';}else if(a==='dialog-submit'){const first=product.querySelector('.dialog input');if(!first?.value.trim()){if(page==='clients')state='client-error';else{first.setAttribute('aria-invalid','true');first.focus();return;}}else{state='ready';toast='Formulaire validé dans la maquette. Le contexte de la page est conservé.';}}else if(a==='more'){toast='Plus : Clients · Compte · Catalogue public';product.querySelector('.content').innerHTML=heading('Plus','Vos autres espaces')+records([['Dons et cadeaux','Liste comptable et annulations','','',go('Ouvrir','gifts')],['Achats fournisseurs','Ajouter des cartes et des scellés','','',go('Ouvrir','supplier-new')],['Clients','Vendeurs et déposants','','',go('Ouvrir','clients')],['Compte','Réglages proposés sur mobile','','',go('Ouvrir','settings')],['Instance connectée','Configurer l’adresse de l’API','','',go('Configurer','connection')],['Catalogue public','La collection visible','','',go('Ouvrir','catalogue')]]);return;}else if(a==='add-line'){const target=document.getElementById('extra-lines');target.innerHTML+=`<div style="margin-top:15px">${field('Article supplémentaire','')}${field('Prix (€)','','number')}</div>`;return;}else if(a==='upload'){toast='Zone de justificatif proposée : fichier privé, conservé avec le dossier.';}else if(a==='retry-upload'){state='ready';toast='Nouvelle tentative d’envoi simulée. Aucun dossier supplémentaire créé.';}else if(a==='document'){toast='Aperçu de téléchargement : les PDF réels restent générés par l’application.';}else{toast='Action simulée dans la maquette.';}render();});

 if(a==='line-remove')supplierLines.splice(i,1);
 if(a==='supplier-line'){if(!supplierDraft.name.trim()||!Number.isInteger(+supplierDraft.qty)||+supplierDraft.qty<1||!supplierDraft.cost.trim()||!supplierDraft.price.trim()||!Number.isFinite(+supplierDraft.cost)||+supplierDraft.cost<0||!Number.isFinite(+supplierDraft.price)||+supplierDraft.price<0||!supplierDraft.regime.trim()||!supplierDraft.rate.trim()||!Number.isFinite(+supplierDraft.rate)||+supplierDraft.rate<0||+supplierDraft.rate>100)flowError='Indiquez le nom, une quantité entière positive, les prix et les informations de TVA.';else {supplierLines.push({...supplierDraft,photos:[...(supplierDraft.photos||[])]});supplierDraft.photos=[];}}
 if(a==='supplier-save'){if(!supplierDraft.supplier.trim()||!supplierDraft.reference.trim()||!supplierDraft.date||!supplierLines.length)flowError='Renseignez le fournisseur, la facture, la date et au moins un produit.';else{supplierLines.forEach(x=>inventory.push({name:x.name,kind:x.kind,origin:'Fournisseur',qty:+x.qty,price:+x.price,cost:+x.cost,reference:supplierDraft.reference,supplier:supplierDraft.supplier,photos:x.photos||[],format:x.kind==='Scellé'?x.format:null}));supplierLines=[];state='success';}}
 if(a==='sale'){const mode=document.getElementById('flow-payment').value;const received=Number(document.getElementById('flow-cash').value)+Number(document.getElementById('flow-transfer').value);if(mode==='Mixte'&&Math.round(received*100)!==Math.round(cartTotal()*100)){flowError='Le paiement mixte doit correspondre au total du panier.';render();return;}if(state==='stale'||Object.entries(shopCart).some(([j,q])=>q>inventory[j].qty))flowError='Quantité indisponible. Aucune vente enregistrée.';else{lastReceipt={total:cartTotal(),mode,lines:Object.entries(shopCart).map(([j,q])=>({name:inventory[j].name,qty:q,price:inventory[j].price}))};receiptVersion=1;Object.entries(shopCart).forEach(([j,q])=>{consumeOpenedStock(+j,q);inventory[j].qty-=q;});shopCart={};state='success';}}
 if(a==='gift-save'){const x=inventory[picked],q=+giftDraft.qty;if(state==='stale'||x.origin==='Dépôt'||!Number.isInteger(q)||q<1||q>x.qty||!giftDraft.date||!giftDraft.reason.trim())flowError='Vérifiez la quantité disponible, la date et le motif.';else{consumeOpenedStock(picked,q);x.qty-=q;gifts.push({...giftDraft,qty:q,name:x.name,cost:x.cost,index:picked,origin:x.origin,reference:x.reference||(x.origin==='Fournisseur'?'FAC-2026-1120':'RAC-2026-038'),cancelled:false});state='success';}}
 if(a==='gift-cancel'&&!gifts[i].cancelled){gifts[i].cancelled=true;inventory[gifts[i].index].qty+=gifts[i].qty;}
 if(a==='gift-export'){const from=document.getElementById('gift-from').value,to=document.getElementById('gift-to').value;if(!from||!to||from>to){flowError='Choisissez une période valide.';}else{const rows=[['Date','Article','Origine','Référence achat','Quantité','Bénéficiaire','Motif','Note','Coût unitaire connu EUR','Coût total connu EUR','Statut'],...gifts.filter(g=>g.date>=from&&g.date<=to).map(g=>[g.date,g.name,g.origin,g.reference,g.qty,g.recipient,g.reason,g.note,g.cost===null?'Non renseigné':g.cost,g.cost===null?'Non renseigné':g.cost*g.qty,g.cancelled?'Annulé':'Actif'])];const csv='\uFEFF'+rows.map(r=>r.map(c=>'"'+String(c).replace(/^[=+@-]/,"'$&").replaceAll('"','""')+'"').join(';')).join('\r\n');const url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='dons-demo.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast='Liste CSV de démonstration téléchargée.';}}
 render();
},true);
const originalMobileEnhance=mobileEnhance;
mobileEnhance=function(){originalMobileEnhance();if(['supplier-new','stock-detail','gift-new','gifts'].includes(page))product.querySelectorAll('.bottomnav button').forEach(b=>b.classList.toggle('active',b.textContent==='Stock'));};

// Opening sealed products and local product-photo previews.
let openingDraft={count:1,perDisplay:36,name:'Booster Pokémon · Étincelles',price:6,target:'1'},openingHistory=[],photoError='';
inventory[0].packSize=36;inventory[0].format='Display';inventory[1].format='Booster';inventory[4].format='Display';
function consumeOpenedStock(index,quantity){for(const op of openingHistory.filter(o=>o.target===index&&!o.cancelled)){const used=Math.min(quantity,op.remaining);op.remaining-=used;quantity-=used;if(!quantity)break;}}
function photoOwner(){return page==='supplier-new'?supplierDraft:inventory[picked];}
function photoPanel(owner){return `<div class="panel"><h2>Photos du produit</h2><small>Scellé ou carte · première photo utilisée en couverture.</small>${photoError?note('Photo non ajoutée',esc(photoError),'error'):''}<div class="actions" style="margin-top:12px"><label class="action photo-choice">Prendre une photo<input data-product-photo type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label><label class="action photo-choice">Choisir dans la galerie<input data-product-photo type="file" accept="image/jpeg,image/png,image/webp" multiple></label></div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px">${(owner.photos||[]).map((url,i)=>`<div><img src="${url}" alt="Photo produit ${i+1}" style="width:100%;height:120px;object-fit:contain;border-radius:8px;background:var(--c-canvas)"><small>${i===0?'Couverture':'Photo '+(i+1)}</small><div class="actions">${i?flowButton('En couverture','photo-cover:'+i,'quiet'):''}${flowButton('Supprimer','photo-remove:'+i,'quiet')}</div></div>`).join('')}</div><small>Aperçu local · 6 photos maximum, JPEG/PNG/WebP, 10 Mo par photo. La caméra dépend de votre appareil. Aucun envoi R2 dans cette maquette.</small></div>`;}
const oldSupplierView=views['supplier-new'],oldStockDetail=views['stock-detail'];
views['supplier-new']=()=>oldSupplierView().replace('<p class="muted">Booster, display, coffret, ETB ou autre objet scellé.</p>',`<label class="field">Format du produit<select data-supplier-format>${['Display','Booster','Coffret','ETB','Autre'].map(f=>`<option ${supplierDraft.format===f?'selected':''}>${f}</option>`).join('')}</select></label>`)+(supplierStep===1&&state!=='success'?photoPanel(supplierDraft):'');
views['stock-detail']=()=>oldStockDetail()+photoPanel(inventory[picked])+(inventory[picked].format==='Display'&&inventory[picked].origin!=='Dépôt'?`<div class="panel"><h2>Vendre le contenu à l’unité</h2><p>Transformez des displays en boosters sans enregistrer de vente.</p>${flowButton('Ouvrir un display','opening-start','primary')}</div>`:'');
pages.push(['opening','Ouvrir un display','Mobile / stock / ouverture',['ready','stale','error','success']]);
pageSelect.innerHTML=pages.map(p=>`<option value="${p[0]}">${p[1]}</option>`).join('');
const openingField=(label,key)=>`<label class="field">${label}<input data-opening="${key}" type="${key==='name'?'text':'number'}" value="${esc(openingDraft[key])}" ${key==='count'||key==='perDisplay'?'min="1" step="1"':''}></label>`;
views.opening=()=>{const x=inventory[picked],d=openingDraft,n=Number(d.count)*Number(d.perDisplay);return heading('Ouvrir un display',x.name,go('Retour au produit','stock-detail','quiet'))+flowNotice()+(state==='success'?note('Ouverture enregistrée · simulation','Le stock de displays et de boosters est mis à jour. Aucune vente enregistrée.','success'):'')+`<div class="panel"><h2>${x.qty} display(s) disponible(s)</h2><div class="stack">${openingField('Displays à ouvrir','count')}${openingField('Boosters par display','perDisplay')}<label class="field">Ajouter les boosters à<select data-opening="target">${inventory.map((v,i)=>v.format==='Booster'&&v.origin!=='Dépôt'&&i!==picked?`<option value="${i}" ${d.target===String(i)?'selected':''}>${esc(v.name)}</option>`:'').join('')}<option value="new" ${d.target==='new'?'selected':''}>Créer un nouveau produit booster</option></select></label>${d.target==='new'?openingField('Nom du booster','name')+openingField('Prix de vente unitaire TTC (€)','price'):''}</div></div><div class="panel"><h2>Avant de confirmer</h2>${summary('Displays retirés',Number(d.count)||0)}${summary('Boosters ajoutés',Number.isFinite(n)?n:0)}${summary('Coût transféré',x.cost===null?'Non renseigné':euro(x.cost*(Number(d.count)||0)))}<small>Le coût total et la facture restent rattachés au lot d’origine. Le prix et la visibilité d’un produit existant sont conservés. Un nouveau booster sera masqué jusqu’à votre choix.</small><div style="margin-top:16px">${flowButton('Confirmer l’ouverture','opening-save','primary')}</div></div>${openingHistory.filter(o=>o.source===picked).map(o=>`<div class="panel"><h2>${o.count} display(s) → ${o.units} boosters</h2><small>${esc(inventory[o.target].name)} · coût transféré ${o.cost===null?'inconnu':euro(o.cost)}</small><p>${o.cancelled?'Ouverture annulée':o.remaining<o.units?'Annulation indisponible : des boosters ont été vendus ou donnés.':'Tous les boosters issus de cette ouverture sont encore disponibles.'}</p>${!o.cancelled&&o.remaining===o.units?flowButton('Annuler cette ouverture','opening-undo:'+openingHistory.indexOf(o),'quiet'):''}</div>`).join('')}`;};
root.addEventListener('input',e=>{if(e.target.dataset.opening)openingDraft[e.target.dataset.opening]=e.target.value;});
root.addEventListener('change',e=>{if(e.target.matches('[data-supplier-format]'))supplierDraft.format=e.target.value;if(e.target.dataset.opening){openingDraft[e.target.dataset.opening]=e.target.value;render();}if(e.target.matches('[data-product-photo]')){const owner=photoOwner(),files=[...e.target.files];photoError='';owner.photos||=[];for(const file of files){if(owner.photos.length>=6){photoError='Maximum 6 photos par produit.';break;}if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>10*1024*1024){photoError='Utilisez une photo JPEG, PNG ou WebP de moins de 10 Mo.';continue;}owner.photos.push(URL.createObjectURL(file));}render();}});
root.addEventListener('click',e=>{const b=e.target.closest('[data-flow]');if(!b||! /^(opening-|photo-)/.test(b.dataset.flow))return;e.stopImmediatePropagation();const [a,v]=b.dataset.flow.split(':');flowError='';
 if(a==='photo-remove')photoOwner().photos.splice(Number(v),1);
 if(a==='photo-cover'){const photos=photoOwner().photos;photos.unshift(photos.splice(Number(v),1)[0]);}
 if(a==='opening-start'){openingDraft={count:1,perDisplay:inventory[picked].packSize||36,name:'Booster · '+inventory[picked].name,price:6,target:inventory.findIndex((x,i)=>i!==picked&&x.name.startsWith('Booster'))+''};if(openingDraft.target==='-1')openingDraft.target='new';return navigate('opening');}
 if(a==='opening-save'){const x=inventory[picked],d=openingDraft,count=Number(d.count),per=Number(d.perDisplay),units=count*per;let target=d.target==='new'?null:inventory[Number(d.target)];if(x.origin==='Dépôt'||x.format!=='Display'||!Number.isSafeInteger(count)||count<1||count>x.qty||!Number.isSafeInteger(per)||per<1||!Number.isSafeInteger(units)||state==='stale'){flowError='Vérifiez le stock et indiquez des quantités entières positives.';}else if(d.target==='new'&&(!d.name.trim()||!String(d.price).trim()||!Number.isFinite(+d.price)||+d.price<0)||d.target!=='new'&&(!target||target===x||target.format!=='Booster'||target.origin==='Dépôt')){flowError='Choisissez un produit cible valide et son prix.';}else{if(!target){target={name:d.name,kind:'Scellé',format:'Booster',origin:x.origin,qty:0,price:+d.price,cost:x.cost===null?null:x.cost/per,hidden:true,photos:[],reference:x.reference,supplier:x.supplier};inventory.push(target);}const targetIndex=inventory.indexOf(target);x.qty-=count;target.qty+=units;openingHistory.push({source:picked,target:targetIndex,count,units,remaining:units,cost:x.cost===null?null:x.cost*count,cancelled:false});state='success';}}
 if(a==='opening-undo'){const o=openingHistory[Number(v)];if(!o||o.cancelled||o.remaining!==o.units||inventory[o.target].qty<o.units)flowError='Cette ouverture ne peut plus être annulée.';else{inventory[o.target].qty-=o.units;inventory[o.source].qty+=o.count;o.cancelled=true;state='ready';}}
 render();
},true);
const enhanceBeforeOpening=mobileEnhance;
mobileEnhance=function(){enhanceBeforeOpening();if(page==='opening')product.querySelectorAll('.bottomnav button').forEach(b=>{b.classList.toggle('active',b.textContent==='Stock');b.setAttribute('aria-current',b.textContent==='Stock'?'page':'false');});if(['stock','sell'].includes(page))product.querySelectorAll('[data-inventory-row]').forEach((card,i)=>{const url=inventory[i].photos?.[0];if(url&&!card.querySelector('img')){const img=document.createElement('img');img.src=url;img.alt=inventory[i].name;img.style.cssText='width:100%;height:140px;object-fit:contain;margin-bottom:12px';card.prepend(img);}});};


function mobileIcon(label){const paths={Stock:'M4 7l8-4 8 4v10l-8 4-8-4V7zm0 0l8 4 8-4m-8 4v10',Vendre:'M3 4h2l3 12h10l3-9H6m3 13h.01M18 20h.01',Rachats:'M6 3h12v18H6zM9 7h6m-6 4h6m-6 4h4',Dépôts:'M4 8h16v12H4zM8 8V4h8v4M4 12h16',Plus:'M5 12h.01M12 12h.01M19 12h.01'};return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[label]||paths.Stock}"/></svg>`;}
const priorAppleEnhance=mobileEnhance;
mobileEnhance=function(){priorAppleEnhance();product.querySelectorAll('.bottomnav button').forEach(b=>{const label=b.textContent;b.innerHTML=mobileIcon(label)+`<span>${label}</span>`;});const back=product.querySelector('.heading [data-action^="go:"]');if(back&&/^(Retour|Continuer)/.test(back.textContent)){back.classList.add('back-link');back.textContent='‹ '+back.textContent;product.querySelector('.heading').prepend(back);}product.querySelectorAll('[data-flow^="photo-remove:"]').forEach(b=>b.classList.add('danger'));product.querySelectorAll('.inventory-row button').forEach(b=>b.setAttribute('aria-label',b.textContent+' · '+b.closest('article').querySelector('strong').textContent));if(['stock','sell'].includes(page))filterInventory();};
root.addEventListener('click',e=>{if(e.target.closest('[data-inventory-filter]'))product.querySelectorAll('[data-inventory-filter]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.inventoryFilter===inventoryFilter));});

page='stock';state='ready';

render();
document.getElementById('device-picker').closest('label').hidden=true;
if(globalThis.Tweak){const options={radius:14};const tweak=new Tweak({container:product,onChange:()=>root.style.setProperty('--c-radius',options.radius+'px')});tweak.addSlider(options,'radius',{label:'Rayon des panneaux',min:6,max:22,unit:'px'});}
window.cartelitesMockup={pages:pages.map(p=>({id:p[0],title:p[1],states:p[3]})),navigate,setState,setDevice:(value)=>{device='mobile';document.getElementById('device-picker').value=device;render();},getState:()=>({page,state,device})};
window.mockupAtlas=window.cartelitesMockup;
})();
